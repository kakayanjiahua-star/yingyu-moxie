<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2563EB">
<title>英语默写小闯关 · 课堂默写预览</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<style>
:root{
  --blue:#2563EB; --blue-d:#1D4ED8; --blue-l:#DBEAFE;
  --amber:#F59E0B; --amber-l:#FEF3C7;
  --green:#16A34A; --green-l:#DCFCE7;
  --red:#EF4444; --red-l:#FEE2E2;
  --ink:#1F2937; --ink2:#6B7280; --line:#E5E7EB;
  --card:#FFFFFF; --r:20px;
  --shadow:0 6px 18px rgba(31,41,55,.10);
  --shadow-s:0 2px 8px rgba(31,41,55,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(165deg,#EFF6FF 0%,#F5F3FF 45%,#FEF3C7 100%) fixed;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:contain;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit;touch-action:manipulation;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea{font-family:inherit;}
.hide{display:none !important;}

/* ---------- top bar ---------- */
.bar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  background:rgba(255,255,255,.86);
  backdrop-filter:saturate(1.6) blur(12px);
  -webkit-backdrop-filter:saturate(1.6) blur(12px);
  border-bottom:1px solid rgba(31,41,55,.06);
}
.bar-btn{
  width:42px;height:42px;min-width:42px;border-radius:14px;
  background:#fff;border:2px solid var(--line);
  font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:transform .12s,background .12s;
}
.bar-btn:active{transform:scale(.92);background:#F3F4F6;}
.bar-btn.off{opacity:.38;}
.bar-title{
  flex:1;text-align:center;font-weight:800;font-size:17px;letter-spacing:.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.bar-right{display:flex;gap:6px;}

/* ---------- layout ---------- */
.wrap{max-width:820px;margin:0 auto;padding:14px 14px 40px;}
.screen{animation:fade .22s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{
  background:var(--card);border-radius:var(--r);padding:16px;
  box-shadow:var(--shadow);margin-bottom:14px;
}
h1{font-size:22px;margin:0 0 6px;font-weight:900;}
h2{font-size:17px;margin:0 0 10px;font-weight:800;}
p.sub{color:var(--ink2);font-size:14px;margin:0 0 12px;line-height:1.55;}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:54px;padding:12px 16px;border-radius:16px;
  font-size:17px;font-weight:800;
  background:#fff;border:2px solid var(--line);
  transition:transform .1s,box-shadow .1s,background .15s;
}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 0 var(--blue-d);}
.btn.primary:active{box-shadow:0 2px 0 var(--blue-d);transform:translateY(3px) scale(.99);}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#fff;box-shadow:0 6px 0 #B45309;}
.btn.amber:active{box-shadow:0 2px 0 #B45309;transform:translateY(3px) scale(.99);}
.btn.green{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 6px 0 #15803D;}
.btn.green:active{box-shadow:0 2px 0 #15803D;transform:translateY(3px) scale(.99);}
.btn.ghost{background:#fff;}
.btn.sm{min-height:44px;font-size:15px;border-radius:13px;}
.row{display:flex;gap:10px;}
.row>*{flex:1;}
.row.wrap2{flex-wrap:wrap;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{
  padding:9px 15px;border-radius:999px;background:#fff;border:2px solid var(--line);
  font-size:15px;font-weight:700;
}
.chip.on{background:var(--blue-l);border-color:var(--blue);color:var(--blue-d);}

/* ---------- upload ---------- */
.aibadge{
  display:flex;align-items:center;gap:8px;padding:10px 13px;border-radius:14px;
  font-size:13.5px;font-weight:700;margin-bottom:13px;line-height:1.45;
}
.aibadge.ok{background:var(--green-l);color:#15803D;border:1.5px solid #86EFAC;}
.aibadge.warn{background:#FEF3C7;color:#92400E;border:1.5px solid #FCD34D;}
.aibadge.wait{background:#F1F5F9;color:var(--ink2);border:1.5px solid var(--line);}
.drop{
  border:2.5px dashed #BFDBFE;border-radius:18px;background:#F8FAFF;
  padding:22px 14px;text-align:center;cursor:pointer;transition:background .15s,border-color .15s;
}
.drop:active{background:#EFF6FF;border-color:var(--blue);}
.drop.dragover,.drop:focus-visible{background:#EAF3FF;border-color:var(--blue);outline:3px solid #DBEAFE;}
.drop .big{font-size:38px;line-height:1;}
.drop .t{font-weight:800;margin-top:8px;font-size:16px;}
.drop .s{color:var(--ink2);font-size:13px;margin-top:4px;}
textarea#rawText{
  width:100%;min-height:140px;border-radius:14px;border:2px solid var(--line);
  padding:12px;font-size:15px;line-height:1.7;resize:vertical;background:#fff;color:var(--ink);
}
textarea#rawText:focus{outline:none;border-color:var(--blue);}
.ocr-bar{margin-top:12px;}
.progress{height:10px;border-radius:99px;background:#E5E7EB;overflow:hidden;}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),#60A5FA);transition:width .25s;}
.ocr-msg{font-size:13px;color:var(--ink2);margin-top:7px;text-align:center;}

/* ---------- review list ---------- */
.item{
  display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:14px;
  background:#FAFAFA;border:1.5px solid var(--line);margin-bottom:8px;
}
.item input[type=text]{
  border:none;background:transparent;font-size:16px;font-weight:700;color:var(--ink);
  min-width:0;padding:4px 2px;border-bottom:2px dashed transparent;
}
.item input[type=text]:focus{outline:none;border-bottom-color:var(--blue);}
.item .en{flex:1.25;}
.item .zh{flex:1;color:var(--blue-d);font-weight:600;font-size:15px;}
.item .del{
  width:34px;height:34px;min-width:34px;border-radius:11px;background:#fff;border:1.5px solid var(--line);
  font-size:15px;color:var(--red);
}
.item .mv{
  width:34px;height:34px;min-width:34px;border-radius:11px;background:#fff;border:1.5px solid var(--line);
  font-size:14px;color:var(--blue-d);
}
.tag{
  font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;
  background:var(--amber-l);color:#92400E;white-space:nowrap;
}
.tag.b{background:var(--blue-l);color:var(--blue-d);}

/* ---------- level list ---------- */
.level{
  display:flex;align-items:center;gap:13px;padding:14px;border-radius:18px;
  background:#fff;border:2px solid var(--line);margin-bottom:10px;
  box-shadow:var(--shadow-s);transition:transform .1s;
}
.level:active{transform:scale(.985);}
.level .ic{font-size:27px;width:44px;text-align:center;}
.level .mid{flex:1;min-width:0;}
.level .nm{font-weight:800;font-size:16px;}
.level .ds{font-size:12.5px;color:var(--ink2);margin-top:2px;}
.level .go{font-size:20px;color:#CBD5E1;}
.level.done{border-color:#BBF7D0;background:#F0FDF4;}
.level.done .go{color:var(--green);}
.stars-line{font-size:13px;letter-spacing:1px;margin-top:2px;}

/* ---------- play ---------- */
.pbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.pbar .progress{flex:1;}
.pbar .cnt{font-size:13px;font-weight:800;color:var(--ink2);white-space:nowrap;}
.escapebar{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.escapebar .tries{font-size:12.5px;font-weight:800;color:var(--ink2);white-space:nowrap;}
.escapebar .tries b{color:#B45309;font-size:14px;}
.escapebar .btn{flex:1;min-height:44px;font-size:14px;}
.qcard{
  background:#fff;border-radius:22px;padding:20px 16px;box-shadow:var(--shadow);
  text-align:center;margin-bottom:14px;
}
.q-zh{font-size:30px;font-weight:900;letter-spacing:2px;line-height:1.35;word-break:break-word;}
.q-zh.small{font-size:21px;letter-spacing:0;line-height:1.6;}
.q-hint{font-size:13px;color:var(--ink2);margin-top:8px;}
.q-en-sent{font-size:19px;line-height:1.8;font-weight:700;}
.blank{
  display:inline-block;min-width:92px;border-bottom:3px solid var(--blue);
  color:var(--blue-d);font-weight:900;
}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.opt{
  min-height:62px;border-radius:16px;background:#fff;border:2.5px solid var(--line);
  font-size:19px;font-weight:800;padding:10px;word-break:break-word;
  transition:transform .1s,background .15s,border-color .15s;
}
.opt:active{transform:scale(.96);}
.opt.good{background:var(--green-l);border-color:var(--green);color:#15803D;}
.opt.bad{background:var(--red-l);border-color:var(--red);color:#B91C1C;}
.opt.mute{opacity:.45;}
.opt:disabled{pointer-events:none;}
#afterBox{margin-top:2px;}
#afterBox .btn{min-height:52px;}
.opt.wide{grid-column:1 / -1;font-size:17px;}

/* letter puzzle */
.slots{
  display:flex;gap:7px;justify-content:center;flex-wrap:wrap;min-height:58px;
  align-items:center;margin-bottom:16px;
}
.slot{
  width:44px;height:56px;border-radius:12px;border:2.5px dashed #CBD5E1;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:900;color:var(--blue-d);text-transform:lowercase;
}
.slot.filled{border-style:solid;border-color:var(--blue);background:var(--blue-l);}
.slot.fixed{border-color:#FCD34D;background:var(--amber-l);color:#92400E;}
.slot.sp{
  width:28px;border-style:solid;border-color:#E2E8F0;background:#F8FAFC;
  color:#94A3B8;font-size:15px;font-weight:700;
}
.slots{gap:7px;}
.slot.sp + .slot{margin-left:6px;}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.tile{
  width:50px;height:58px;border-radius:13px;background:#fff;border:2.5px solid var(--line);
  font-size:23px;font-weight:900;box-shadow:0 3px 0 #E5E7EB;
  transition:transform .1s;
}
.tile:active{transform:scale(.92);}
.tile.used{opacity:.25;pointer-events:none;}
.tile.tap{background:var(--amber-l);border-color:var(--amber);}

/* word order */
.tokens{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:52px;padding:8px;
  border-radius:14px;background:#F8FAFC;border:2px dashed #CBD5E1;margin-bottom:14px;}
.ans-line{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:52px;padding:8px;
  border-radius:14px;background:#EFF6FF;border:2px solid var(--blue-l);}
.wt{
  padding:9px 13px;border-radius:12px;background:#fff;border:2px solid var(--line);
  font-size:17px;font-weight:700;box-shadow:0 3px 0 #E5E7EB;
}
.wt:active{transform:scale(.94);}
.wt.used{opacity:.25;pointer-events:none;}

/* write / canvas */
.writebox{margin-top:6px;}
/* 写字区：参考线放在画布"后面"的独立层里，这样橡皮只擦掉笔迹、不会把格线也擦没 */
.handwrap{
  position:relative;border:2.5px solid var(--line);border-radius:16px;
  background:#fff;overflow:hidden;
}
.handwrap .guides{position:absolute;inset:0;pointer-events:none;z-index:0}
.handwrap .guides i{position:absolute;left:10px;right:10px;height:0;border-top:1.5px dashed #E2E8F0}
.handwrap .guides i.baseline{border-top-style:solid;border-top-color:#CBD5E1}
canvas.hand{
  position:relative;z-index:1;display:block;width:100%;height:100%;
  background:transparent;touch-action:none;
}
.handwrap{height:clamp(240px,35vh,340px);}
.handwrap.tall{height:clamp(310px,46vh,440px);}
.hint4{font-size:12px;color:var(--ink2);text-align:center;margin-top:6px;}
.htools{display:flex;gap:8px;margin-top:10px;}
.htools .chip{flex:1;text-align:center;justify-content:center;min-height:46px;display:flex;align-items:center;}
input.type{
  width:100%;min-height:58px;border-radius:14px;border:2.5px solid var(--line);
  font-size:22px;font-weight:800;padding:12px 14px;text-align:center;letter-spacing:1px;
}
input.type:focus{outline:none;border-color:var(--blue);}
.answer{
  margin-top:12px;padding:12px;border-radius:14px;background:var(--green-l);
  border:2px solid #86EFAC;font-size:19px;font-weight:900;color:#15803D;word-break:break-word;
}
.answer.bad{background:var(--red-l);border-color:#FCA5A5;color:#B91C1C;}
.choice-feedback{margin-top:12px;font-size:13px;font-weight:800;color:var(--blue);}
.choice-next-track{height:8px;margin-top:7px;border-radius:99px;background:#DBEAFE;overflow:hidden;}
.choice-next-track i{display:block;width:0;height:100%;background:var(--blue);animation:choice-next var(--choice-pause,3s) linear forwards;}
@keyframes choice-next{to{width:100%}}

/* result */
.big-num{font-size:52px;font-weight:900;line-height:1;color:var(--amber);}
.center{text-align:center;}

/* wrong book / stats */
.wrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;
  background:#fff;border:1.5px solid var(--line);margin-bottom:8px;}
.wrow .en{font-weight:800;font-size:17px;flex:1.2;min-width:0;word-break:break-word;}
.wrow .zh{color:var(--ink2);font-size:14px;flex:1;min-width:0;word-break:break-word;}
.wrow .n{font-size:12px;font-weight:800;color:#B91C1C;background:var(--red-l);padding:3px 8px;border-radius:999px;}
table.st{width:100%;border-collapse:collapse;font-size:14px;}
table.st th,table.st td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);}
table.st th{color:var(--ink2);font-weight:700;font-size:12.5px;}
table.st td.d{text-align:left;font-weight:700;}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden;}
.fxstar{position:absolute;font-size:30px;animation:fly 1s ease-out forwards;}
@keyframes fly{0%{opacity:0;transform:translateY(0) scale(.4)}
  25%{opacity:1;transform:translateY(-30px) scale(1.25)}
  100%{opacity:0;transform:translateY(-150px) scale(.85)}}
#combo{
  position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) scale(.6);
  font-size:38px;font-weight:900;color:var(--amber);z-index:210;pointer-events:none;
  text-shadow:0 3px 0 #fff,0 0 22px rgba(245,158,11,.7);opacity:0;
}
#combo.show{animation:pop .9s ease-out;}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  75%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.shake{animation:shk .4s;}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
  40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
#toast{
  position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:rgba(31,41,55,.94);color:#fff;padding:11px 20px;border-radius:999px;
  font-size:14px;font-weight:700;z-index:300;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
/* ---------- 确认弹窗（iOS 上比系统 confirm 好看，也能给多个选项） ---------- */
#modal{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:400;
  display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
.mbox{background:#fff;border-radius:22px;padding:22px;max-width:440px;width:100%;
  box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:80vh;overflow:auto}
.mbox h3{margin:0 0 8px;font-size:19px;font-weight:900}
.mbox p{margin:0 0 16px;font-size:14.5px;color:var(--ink2);line-height:1.6;white-space:pre-line}
.mrow{display:flex;gap:10px;flex-wrap:wrap}
.mrow .btn{flex:1;min-width:118px;}
/* ---------- 上传前裁切 ---------- */
.cropstage{display:flex;justify-content:center;background:#0F172A;border-radius:18px;padding:10px;overflow:hidden}
.cropwrap{position:relative;display:inline-block;max-width:100%;line-height:0;
  user-select:none;-webkit-user-select:none;touch-action:none}
.cropwrap img{max-width:100%;max-height:56vh;display:block;pointer-events:none;border-radius:8px}
.cropbox{position:absolute;box-sizing:border-box;border:2.5px solid #fff;
  box-shadow:0 0 0 9999px rgba(15,23,42,.62);touch-action:none;cursor:move;border-radius:4px}
.cropbox i{position:absolute;width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.95);border:2.5px solid var(--blue);box-sizing:border-box}
.cropbox i[data-h=nw]{left:-19px;top:-19px}
.cropbox i[data-h=ne]{right:-19px;top:-19px}
.cropbox i[data-h=sw]{left:-19px;bottom:-19px}
.cropbox i[data-h=se]{right:-19px;bottom:-19px}
.cropthumbs{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.cropthumbs span{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;
  background:#E5E7EB;color:#6B7280}
.cropthumbs span.on{background:var(--blue);color:#fff}
.spin{display:inline-block;width:15px;height:15px;border:2.5px solid #fff;border-top-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:360px){ .opt{font-size:17px;} .q-zh{font-size:26px;} }
@media (min-width:700px){ .opts{grid-template-columns:1fr 1fr;} }
.dict-entry{border:2px solid #93C5FD;background:#EFF6FF}
.dict-entry .btn{margin-top:10px}
.dict-meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.dict-meta span{background:#E0F2FE;color:#075985;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:800}
.dict-source{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dict-source .chip{width:100%;min-height:48px}
.dict-setting{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.dict-setting label{display:block;font-size:13px;font-weight:800;color:var(--ink2)}
.dict-setting input{display:block;width:100%;font-family:inherit;font-size:20px;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:9px;margin-top:6px}
.dict-prompt{font-size:clamp(26px,5vw,38px);font-weight:900;line-height:1.35;text-align:center;padding:22px 10px;overflow-wrap:anywhere}
.dict-input{display:block;width:100%;min-height:58px;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:23px;font-family:Georgia,'Times New Roman',serif}
.dict-input:focus{border-color:var(--blue);outline:none}
.dict-paper{border:2px dashed #93C5FD;border-radius:14px;background:#EFF6FF;padding:20px;text-align:center;font-size:16px}
.dict-hand{height:clamp(250px,42vh,380px)}
.dict-hand.tall{height:clamp(320px,50vh,460px)}
.dict-ink{display:block;width:100%;max-height:180px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:white;margin:10px 0}
.dict-steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.dict-steps span{flex:1;min-width:100px;padding:9px;border-radius:10px;background:#F1F5F9;color:#475569;text-align:center;font-size:13px;font-weight:800}
.dict-steps .on{background:#DBEAFE;color:#1D4ED8}
.dict-time-row{display:flex;justify-content:flex-end;margin:4px 0 8px}
.dict-countdown{min-width:76px;padding:5px 11px;border-radius:12px;background:#E0F2FE;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;text-align:center;color:var(--blue)}
.dict-countdown small{font-size:13px;margin-left:2px}
.dict-countdown.low{color:var(--red)}

<script>
/* =========================================================
   英语默写小闯关 — 单文件版
   流程：拍照/粘贴 → 校对 → 闯关 → 默写测 → 错词本
   ========================================================= */
const APP_VERSION = 'v2026-10-11';
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const today = ()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const norm  = s=>String(s||'').replace(/[\u2018\u2019\u02BC\u201B]/g,"'").toLowerCase()
                   .replace(/[^a-z0-9' ]/g,'').replace(/\s+/g,' ').trim();
const uniq  = a=>[...new Set(a)];

/* ---------- 持久化 ---------- */
const PROFILE_ACTIVE_KEY='dxxg.activeProfile.v1';
const PROFILE_OWNER_KEY='dxxg.deviceOwner.v1';
const PROFILE_NAMES={dabao:'大宝',xiaobao:'小宝'};
const LEGACY_KEYS=['dxxg.wrong','dxxg.stats','dxxg.sound','dxxg.grade',
  'dxxg.session','dxxg.run','dxxg.materials.v1','dxxg.review.v1','dxxg.review.device'];
const LEGACY_CLAIM_KEY='dxxg.legacyOwner.v1';
function legacyEntries(){
  return LEGACY_KEYS.map(key=>[key,localStorage.getItem(key)]).filter(([,value])=>value!==null);
}
function downloadLegacyBackup(id,entries){
  const data={schemaVersion:1,profileId:id,exportedAt:new Date().toISOString(),
    description:'上线前旧学习记录备份；不含 API Key。',storage:Object.fromEntries(entries)};
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;
  a.download='英语默写旧记录备份-'+PROFILE_NAMES[id]+'-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
}
function migrateLegacy(id,entries){
  const written=[];
  try{
    if(entries.some(([key])=>localStorage.getItem(key+'.'+id)!==null))
      throw Error('此通道已有记录，请先导出当前档案');
    for(const [key,value] of entries){
      const target=key+'.'+id;
      localStorage.setItem(target,value);written.push(target);
    }
    localStorage.setItem(LEGACY_CLAIM_KEY,id);
    return true;
  }catch(e){
    for(const key of written) localStorage.removeItem(key);
    toast(e.message||'空间不足，旧记录未迁入');
    return false;
  }
}
const Profile=(()=>{
  try{const id=sessionStorage.getItem(PROFILE_ACTIVE_KEY);return PROFILE_NAMES[id]?id:'';}catch(e){return '';}
})();
const profileKey=key=>Profile?key+'.'+Profile:null;
const K = {wrong:profileKey('dxxg.wrong'), stats:profileKey('dxxg.stats'),
  sound:profileKey('dxxg.sound'), grade:profileKey('dxxg.grade')};
function load(k,d){ if(!k)return d;try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;} }
function save(k,v){ if(!k)return;try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }

const Store = {
  wrong: load(K.wrong,[]),
  stats: load(K.stats,{}),
  sound: load(K.sound,true),
  grade: load(K.grade,3),
};
const SETTINGS_KEY=profileKey('dxxg.settings.v1');
const SETTINGS_DEFAULT={wordSeconds:20,longWordSeconds:25,sentenceSeconds:35,choiceRepeats:2,choicePause:3,reviewDailyCap:10,fontSize:'normal'};
const Settings={...SETTINGS_DEFAULT,...load(SETTINGS_KEY,{})};
function settingNumber(key,value,min,max){
  const n=Number(value);
  return Number.isFinite(n)?Math.max(min,Math.min(max,Math.round(n))):SETTINGS_DEFAULT[key];
}
function applyFontSize(){ document.body.dataset.fontSize=['normal','large','extra'].includes(Settings.fontSize)?Settings.fontSize:'normal'; }
applyFontSize();
const CLOUD_ENV='kaka888-d5ghfuff1958de22c';
const CLOUD_KEY=profileKey('dxxg.cloud.v1');
const Cloud={...load(CLOUD_KEY,{paired:false,profileId:'',lastSync:0}),app:null,busy:false,pending:false,timer:null,error:''};
async function cloudApp(){
  if(Cloud.app) return Cloud.app;
  const url=new URL('cloudbase-sdk.js',location.href);
  url.search=location.search; // 局域网服务的同一访问令牌也用于读取 SDK 文件。
  const sdk=await import(url.href);
  Cloud.app=(sdk.default||sdk).init({env:CLOUD_ENV});
  return Cloud.app;
}
async function cloudCall(action,data={}){
  const app=await cloudApp(), auth=app.auth();
  if(!auth.hasLoginState()) await auth.signInAnonymously();
  const response=await app.callFunction({name:action==='bind'?'moxiePair':'moxie',data:{action,...data}});
  const result=response.result;
  if(result?.success===true) return result.data;
  throw Error(result?.error?.message||'云端连接失败');
}
function cloudSaveState(){ save(CLOUD_KEY,{paired:Cloud.paired,profileId:Cloud.profileId,lastSync:Cloud.lastSync}); }
function cloudArchive(){
  return {schemaVersion:2,deviceId:REVIEW_DEVICE_ID,materials:materialList(),
    sessions:Review.sessions,plan:reviewProgress()};
}
function queueCloudSync(){
  if(!Cloud.paired) return;
  Cloud.pending=true;
  clearTimeout(Cloud.timer);
  Cloud.timer=setTimeout(()=>{void cloudSync()},1000);
}
async function cloudSync(){
  if(!Cloud.paired||Cloud.busy||!Cloud.pending||!navigator.onLine) return;
  Cloud.busy=true; Cloud.pending=false;
  try{
    const result=await cloudCall('sync',{profileId:Profile,archive:cloudArchive()});
    Cloud.lastSync=result.updatedAt||Date.now(); Cloud.error=''; cloudSaveState();
    if(Cloud.pending) queueCloudSync();
  }catch(e){Cloud.pending=true;Cloud.error=e?.message||'同步失败';}
  finally{Cloud.busy=false;cloudPaintStatus();}
}
async function cloudBind(code){
  const result=await cloudCall('bind',{code,deviceId:REVIEW_DEVICE_ID,profileId:Profile});
  if(result.profileId!==Profile) throw Error('配对码属于另一位孩子');
  const app=await cloudApp();
  await app.auth().signInWithCustomTicket(()=>Promise.resolve(result.ticket));
  Cloud.paired=true; Cloud.profileId=result.profileId; Cloud.error=''; cloudSaveState();
  AI_STATE='unknown';
  queueCloudSync();
}
function cloudPaintStatus(){
  const el=$('#cloudStatus'); if(!el) return;
  el.textContent=Cloud.error?'同步未完成：'+Cloud.error:Cloud.paired
    ?(Cloud.lastSync?'已同步 · '+new Date(Cloud.lastSync).toLocaleString('zh-CN'):'已配对，等待首次同步')
    :'未连接云端';
}
window.addEventListener('online',()=>{if(Cloud.paired){Cloud.pending=true;void cloudSync();}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Cloud.paired){Cloud.pending=true;void cloudSync();}});
setInterval(()=>{if(Cloud.pending)void cloudSync()},30000);

/* ---------- 全局状态 ---------- */
const S = {
  words: [],   // {en, zh, on}
  sents: [],   // {en, zh, on, key}
  unit: '',
  done: {},    // levelId -> stars
  writeMode: 'hand',   // hand | type
  lastWrong: [],
  materialId:'', source:'teacher', title:'', notes:[],
};

/* ---------- 词库 / 干扰项 ---------- */
const POOL = ['apple','banana','orange','tiger','monkey','school','teacher','student','pencil','water',
 'happy','family','garden','window','yellow','panda','rabbit','flower','friend','summer','winter',
 'morning','picture','music','doctor','farmer','driver','kitchen','holiday','birthday','animal',
 'brother','sister','country','weather','library','homework','breakfast','afternoon','beautiful','delicious'];

/* =========================================================
   声音
   ========================================================= */
let voice = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices()||[];
    voice = vs.find(v=>/en[-_]US/i.test(v.lang)&&/samantha|alex|google us english|aaron|nicky/i.test(v.name))
         || vs.find(v=>/en[-_]US/i.test(v.lang))
         || vs.find(v=>/^en/i.test(v.lang)) || null;
  }catch(e){}
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

/* 自动化/无人值守浏览器（Playwright、Selenium 等 navigator.webdriver=true）默认不发声：
   Windows 上 Chrome 的朗读走系统 SAPI，不受 --mute-audio 控制，
   测试脚本跑真实语音引擎时，声音会直接从这台电脑的扬声器放出来。
   用 let 而不是 const：测试里可以临时打开它，把真实语音链路也测到。 */
let AUTOMATION = (typeof navigator!=='undefined' && navigator.webdriver === true);

function speak(text, rate){
  if(!Store.sound || AUTOMATION) return;
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang='en-US'; u.rate = rate||0.82; u.pitch=1;
    if(voice) u.voice = voice;
    curUtterance = u;
    speechSynthesis.speak(u);
  }catch(e){}
}
let AC=null;
let speakSeq = 0;            // 每来一次发声请求就 +1；旧请求发现序号变了就直接放弃
let curUtterance = null;     // 保住引用：有些浏览器会把还没念完的 utterance 回收掉

function stopSpeak(){
  speakSeq++;
  try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
  curUtterance = null;
}
/* 念完才 resolve。三个关键点：
   ① cancel() 之后必须「让一拍」再 speak()。iOS Safari 上紧挨着调用会打架：
      旧语音继续念、新语音排到它后面 —— 表现就是「题目已经换了，念的还是上一题」。
   ② 带序号：让这一拍期间如果又来了新请求，旧的就彻底放弃，绝不补念。
   ③ 超时兜底：iOS 上 onend 偶尔不触发。 */
function speakWait(text, rate, lang='en-US', force=false){
  const mySeq = ++speakSeq;
  return new Promise(resolve=>{
    if(AUTOMATION || (!Store.sound && !force) || !text || !('speechSynthesis' in window)) return resolve();
    let done=false;
    const fin=()=>{ if(done) return; done=true; resolve(); };
    const t = String(text);
    try{ speechSynthesis.cancel(); }catch(e){}
    setTimeout(()=>{
      if(mySeq !== speakSeq) return fin();      // 已被更新的请求取代：这一个字都不要念
      try{
        const u = new SpeechSynthesisUtterance(t);
        u.lang=lang; u.rate = rate||0.82; u.pitch=1;
        if(lang==='zh-CN'){
          const zhVoice=(speechSynthesis.getVoices()||[]).find(v=>/^zh[-_]CN/i.test(v.lang));
          if(zhVoice) u.voice=zhVoice;
        }else if(voice) u.voice = voice;
        u.onend = fin; u.onerror = fin;
        curUtterance = u;
        speechSynthesis.speak(u);
      }catch(e){ fin(); }
    }, 90);
    setTimeout(fin, Math.min(12000, 1800 + t.length*110));
  });
}
function beep(kind){
  if(!Store.sound || AUTOMATION) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const seq = kind==='ok'   ? [[660,0,.09],[880,.09,.13]]
              : kind==='bad'  ? [[220,0,.18]]
              : kind==='done' ? [[660,0,.09],[880,.1,.09],[1180,.2,.22]]
              : [[520,0,.08]];
    seq.forEach(([f,t,d])=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type= kind==='bad'?'sawtooth':'sine'; o.frequency.value=f;
      o.connect(g); g.connect(AC.destination);
      const st=AC.currentTime+t;
      g.gain.setValueAtTime(.0001,st);
      g.gain.exponentialRampToValueAtTime(kind==='bad'?.12:.16, st+.012);
      g.gain.exponentialRampToValueAtTime(.0001, st+d);
      o.start(st); o.stop(st+d+.02);
    });
  }catch(e){}
}

/* =========================================================
   小工具：吐司 / 特效 / 星星

let toastT=null;
function toast(msg,ms){

}

/* =========================================================
   文本解析：把 OCR / 粘贴的文字拆成 单词 & 句子
   ========================================================= */
function fixEnglishApostrophes(s){
  return String(s||'').replace(/[‘’]/g,"'")
    .replace(/\b([A-Za-z]+)\s*'\s*(s|t|d|ll|re|ve|m)\b/gi,"$1'$2");
}
function cleanLine(s){
  return String(s)
    .replace(/[|‖_~`^]/g,' ')
    .replace(/^[\s\u3000]*[0-9]{1,2}\s*[\.、)）:：]\s*/,'')   // 序号
    .replace(/^[\s\u3000]*[•·▪●※★→\-–—]+\s*/,'')            // 项目符号
    .replace(/\s{2,}/g,' ')
    .trim();
}
function parseBlocks(text){
  const words=[], sents=[];
  const lines = String(text||'')
    .replace(/\r/g,'')
    .split('\n')
    .map(cleanLine)
    .filter(l=>l && /[A-Za-z]/.test(l));

  for(const line of lines){
    // 英文部分（去掉中文及其标点）
    const en = fixEnglishApostrophes(line
      .replace(/[\u4e00-\u9fa5\u3000-\u303F\uFF00-\uFFEF]/g,' ')
      .replace(/[^A-Za-z'’\-\.\,\?\!\;\:\s]/g,' ')
      .replace(/\s+/g,' ').trim()
      .replace(/\s+(?:n|v|adj|adv|pron|prep|conj|num|art|int)\.$/i,'').trim());
    // 中文部分
    const zh = (line.match(/[\u4e00-\u9fa5]+/g)||[]).join(' ').trim();

    const toks = (en.match(/[A-Za-z][A-Za-z'’\-]*/g)||[]);
    if(toks.length===0) continue;

    /* 判断是「句子」还是「单词/词组」：
       词组（want to do sth / a lot of / take care of）词数不少，但它是词不是句。
       所以不能只看词数——要看有没有句末标点、或者是不是以主语/冠词开头。 */
    const endsSent = /[.!?。！？]\s*$/.test(en);
    const startsLikeSent = /^(i|you|he|she|we|they|it|this|that|these|those|my|your|his|her|our|their|the|a|an|there|what|where|who|how|let)\b/i.test(en);
    const isSent = (endsSent && toks.length >= 1)
                || toks.length >= 6
                || (toks.length >= 4 && startsLikeSent);

    if(isSent){
      let s = en.replace(/\s+([\.\,\?\!\;\:])/g,'$1').trim();
      if(s && !/[\.\?\!]$/.test(s)) s += '.';
      sents.push({en:s, zh:cleanZh(zh), kind:'sent'});
    }else{
      const w = en.replace(/[\.\,\?\!\;\:]+$/,'').trim();
      if(w) words.push({en:w, zh:cleanZh(zh), kind:'word'});
    }
  }
  // 去重
  const seenW=new Set(), W=[];
  for(const w of words){ const k=norm(w.en); if(!k||seenW.has(k))continue; seenW.add(k); W.push(w); }
  const seenS=new Set(), Ss=[];
  for(const s of sents){ const k=norm(s.en); if(!k||seenS.has(k))continue; seenS.add(k); Ss.push(s); }

  return {words:W.slice(0,60), sents:Ss.slice(0,30)};
}
const STOP = new Set('the a an is am are was were be to of in on at and or but it i you he she we they my your his her this that these those do does did can will not no yes very too so here there what who how with for from up down out'.split(' '));
function pickKey(sentence){
  const toks = (sentence.match(/[A-Za-z][A-Za-z'\-]*/g)||[]).filter(t=>t.length>=3);
  const good = toks.filter(t=>!STOP.has(t.toLowerCase()));
  const list = good.length?good:toks;
  if(!list.length) return null;
  return list.slice().sort((a,b)=>b.length-a.length)[0];
}

/* =========================================================
   浏览器端 OCR（Tesseract.js，多 CDN 兜底）
   ========================================================= */

/* 语言包：优先用同目录 tessdata/（局域网打开时最快、且不依赖外网），否则回退公共 CDN */
function localTessDir(){
  try{ return new URL('tessdata', document.baseURI).href.replace(/\/$/,''); }
  catch(e){ return 'tessdata'; }
}
let langPathsCache = null;
async function langPaths(){
  if(langPathsCache) return langPathsCache;
  const out=[];
  // 通过局域网/网页打开时，语言包就在同目录 tessdata/，本地最快且不依赖外网。
  // 只有把 html 当文件直接打开（file://）时才直接用公共源。
  if(location.protocol==='http:' || location.protocol==='https:') out.push(localTessDir());
  out.push('https://tessdata.projectnaptha.com/4.0.0');
  langPathsCache = out;
  return out;
}
let tWorker=null, ocrBusy=false;

function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src; s.async=true;
    s.onload=()=>res(src); s.onerror=()=>{s.remove();rej(new Error('load fail '+src));};
    document.head.appendChild(s);
    setTimeout(()=>{ if(!window.Tesseract) rej(new Error('timeout '+src)); }, 22000);
  });
}
async function ensureOcrSrc(){
  if(window.Tesseract) return true;
  for(const u of OCR_SRC){
    try{ await loadScript(u); if(window.Tesseract) return true; }catch(e){}
  }
  return !!window.Tesseract;
}
async function ensureWorker(onMsg){
  if(tWorker) return tWorker;
  const lps = await langPaths();
  for(let ci=0; ci<OCR_CDN.length; ci++){
    for(const lp of lps){
      const c = OCR_CDN[ci];
      try{
        if(onMsg) onMsg({status:'retry', progress:0, _try:[ci+1, lp.indexOf('projectnaptha')>=0?'公共源':'本地']});
        tWorker = await window.Tesseract.createWorker(OCR_LANG_NAME, 1, {
          workerPath: c.w, corePath: c.c, langPath: lp,
          logger: m=>{ if(onMsg) onMsg(m); }
        });
        return tWorker;
      }catch(e){ tWorker=null; }
    }
  }
  throw new Error('OCR 引擎加载失败');
}

function loadImg(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file);
    const im=new Image();
    im.onload=()=>{ URL.revokeObjectURL(u); res(im); };
    im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error('图片读不出来')); };
    im.src=u;
  });
}
/* 手机上原图 3-5MB，先缩到长边 1800 再传，又快又够清楚 */
async function shrink(file, maxSide, q){
  const im = await loadImg(file);
  const s = Math.min(1, (maxSide||1800)/Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement('canvas');
  c.width  = Math.max(1, Math.round(im.naturalWidth * s));
  c.height = Math.max(1, Math.round(im.naturalHeight * s));
  const ctx = c.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(im, 0, 0, c.width, c.height);
  return await new Promise(res=>{
    if(c.toBlob) c.toBlob(b=>res(b||null), 'image/jpeg', q||0.86);
    else res(null);
  });
}

const OCR_PROMPT = `你是英语知识梳理的逐项抄录员。按照片版面从上到下，提取全部 A/B/C 学习内容，只输出严格 JSON。
标题中的年级与 Unit 放 unit 字段。A「核心词句（四会）」的词、词组、短句和完整句子都要提取；尤其逐行检查 A 区的「句」表，不能只读上方单词。B「其他词汇」也要逐项提取。C「句型与语法」整理为 notes，每条保留中文要点和示例。三部分都入库，只有 A 后续用于默写。
words 数组放词或词组；sentences 数组放完整句或课堂口语短句，包括 Excellent!、Slow down.、Not exactly.；notes 数组放语法要点。每条必须有 section:"A"/"B"/"C"。若原图没有 A/B/C 标题，普通材料默认 section:"B"，供用户核对后改层级。
英文和对应中文照原文逐条配对，不合并相邻条目，保留大小写、连字符、标点。排除题号、页码、姓名栏、标题、照片外内容和看不清的条目。不要把 C 区示例句重复收入 A。输出前特别自查 A 句子数量及长单词拼写。无法确认的写进 ignored，不要猜造。
只输出 JSON，不要 markdown：{"unit":"5A Unit 2","has_a_section":true,"words":[{"en":"traditional","zh":"传统的","section":"A"},{"en":"sandbag","zh":"沙包","section":"B"}],"sentences":[{"en":"Not exactly.","zh":"不完全是。","section":"A"}],"notes":[{"text":"祈使句：动词原形开头；否定式 Don't + 动词原形。","section":"C"}],"fixed":[],"ignored":""}`;
const OCR_SENT_PROMPT=`只看图片中 A「核心词句（四会）」区里的「句」栏，逐行抄录英文短句和右侧中文。不要读 B/C，也不要把词汇栏内容当句子。短句如 Excellent!、Slow down.、Not exactly. 都要保留。看不清就不要猜。只输出 JSON：{"sentences":[{"en":"Not exactly.","zh":"不完全是。","section":"A"}]}`;

const INSTRUCTION_WORDS = new Set(('read write listen say look match choose fill answer complete tick circle '+
  'underline translate repeat practise practice total score name class grade date page unit lesson part '+
  'module section chapter exercise homework english chinese word words sentence sentences question '+
  'questions example note notes tip tips').split(' '));

function looksLikeJunk(en, zh){
  const e = String(en||'').trim();
  if(e.length < 2) return true;
  if(!/[A-Za-z]/.test(e)) return true;
  if(/^(unit|lesson|module|part|page|chapter|section|exercise|no|p|pp)\s*[\d.\-]*$/i.test(e)) return true;
  if(/^[\d.\-–—/:]+l*$/.test(e)) return true;
  if(!String(zh||'').trim()){
    const low = e.toLowerCase().replace(/[.!?:;]+$/,'').trim();
    if(INSTRUCTION_WORDS.has(low)) return true;
    if(low.split(/\s+/).length<=1 && low.length<=2) return true;
  }
  return false;
}
function stripFence(s){
  let t = String(s||'').trim();
  if(t.startsWith('```')){ t = t.split('\n').slice(1).join('\n'); if(t.trim().endsWith('```')) t = t.trim().slice(0,-3); }
  const i=t.indexOf('{'), j=t.lastIndexOf('}');
  return (i>=0 && j>i) ? t.slice(i, j+1) : t.trim();
}
const sentLike = e => {
  const toks = (String(e).match(/[A-Za-z][A-Za-z'\-]*/g)||[]);
  return (toks.length>=1 && /[.!?]\s*$/.test(String(e).trim())) || toks.length>=6;
};

/* 模型有时候把一整段塞进一条 sentence（中文也是），
   句子排序就会一次甩出十几个词，根本排不动。
   这里按句末标点切开。不用 lookbehind，兼容旧 Safari。 */
function splitMultiSentences(en, zh){
  const one = { en: String(en||'').trim(), zh: String(zh||'').trim() };
  const parts = [];
  let cur = '';
  const s = one.en;
  for(let i=0;i<s.length;i++){
    cur += s[i];
    if(/[.!?]/.test(s[i])){
      const rest = s.slice(i+1);
      if(rest.trim()==='' || /^\s+["'A-Z]/.test(rest)){ parts.push(cur.trim()); cur=''; }
    }
  }
  if(cur.trim()) parts.push(cur.trim());
  const good = parts.filter(p => p.split(/\s+/).filter(Boolean).length >= 3);
  if(good.length < 2) return [one];

  // 中文也按句号切；两边句数对得上才配对，对不上就整段给第一句
  const zparts = [];
  let zc = '';
  for(const ch of one.zh){
    zc += ch;
    if('。！？'.indexOf(ch) >= 0){ zparts.push(zc.trim()); zc=''; }
  }
  if(zc.trim()) zparts.push(zc.trim());
  return good.map((p, i) => ({ en: p, zh: zparts.length === good.length ? zparts[i] : (i===0 ? one.zh : '') }));
}

/* 浏览器直接调百炼 */
async function imageBase64(blob){
  return await new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>res(String(fr.result).split(',')[1]);
    fr.onerror = ()=>rej(new Error('图片读取失败'));
    fr.readAsDataURL(blob);
  });
}
// ponytail: 云函数单次请求上限为 6MB；照片超过 3MB 时逐级缩小，保留优先可读的大图。
async function cloudPhoto(file,firstBlob){
  let blob=firstBlob;
  for(const [side,quality] of [[1800,.82],[1400,.72],[1100,.65]]){
    if(blob.size<=3000000) return await imageBase64(blob);
    blob=await shrink(file,side,quality);
    if(!blob) throw new Error('图片处理失败');
  }
  if(blob.size>3000000) throw new Error('图片太大，请拍近一些或选择更清晰的单页照片');
  return await imageBase64(blob);
}
async function vlmDirect(cfg, blob, prompt=OCR_PROMPT){
  const b64 = await imageBase64(blob);
  const url = cfg.base.replace(/\/+$/,'') + '/compatible-mode/v1/chat/completions';
  const r = await fetch(url, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+cfg.key },
    body: JSON.stringify({
      model: cfg.model || 'qwen3-vl-plus',
      messages:[{ role:'user', content:[
        { type:'image_url', image_url:{ url:'data:'+(blob.type||'image/jpeg')+';base64,'+b64 } },
        { type:'text', text: prompt }
      ]}],
      temperature: 0.05, max_tokens: prompt===OCR_PROMPT?6000:1500
    })
  });
  if(!r.ok){
    let detail = '';
    try{ detail = (await r.text()).slice(0,180); }catch(e){}
    if(r.status===401||r.status===403) throw new Error('API Key 不对或没有权限（HTTP '+r.status+'）');
    if(r.status===429) throw new Error('调用太频繁，等一下再试');
    throw new Error('AI 接口报错 HTTP '+r.status+' '+detail);
  }
  const j = await r.json();
  let content = j && j.choices && j.choices[0] && j.choices[0].message ? j.choices[0].message.content : '';
  if(Array.isArray(content)) content = content.map(c=>c && c.text || '').join('');
  const data = JSON.parse(stripFence(content));
  return data;
}

function ocrTier(section){ return ['A','B','C'].includes(String(section||'').toUpperCase())?String(section).toUpperCase():'B'; }

async function aiOcr(files, onProgress){
  const direct = getApiCfg();
  if(!direct&&location.hostname==='kakayanjiahua-star.github.io'&&
     AI_STATE!=='cloud'&&await checkAi()!=='cloud')
    throw new Error(AI_LAST_ERROR||'请先连接家长账号');
  const acc = {words:[], sentences:[], notes:[], model:''};
  const total = files.length;
  for(let i=0;i<total;i++){
    onProgress({_stage:'shrink', _file:i+1, _total:total});
    const blob = await shrink(files[i], 2300, 0.9);
    if(!blob) throw new Error('图片处理失败');
    onProgress({_stage:'upload', _file:i+1, _total:total});
    let j = null;
    if(direct){
      const data = await vlmDirect(direct, blob);
      if(data.has_a_section===true && !(data.sentences||[]).some(s=>ocrTier(s.section)==='A')){
        try{
          const focused=await vlmDirect(direct,blob,OCR_SENT_PROMPT);
          data.sentences=[...(data.sentences||[]),...(focused.sentences||[]).map(s=>({...s,section:'A'}))];
        }catch(e){ /* 主识别结果仍可供核对 */ }
      }
      j = { ok:true, schemaVersion:2, model: direct.model || 'qwen3-vl-plus',
            words:data.words||[], sentences:data.sentences||[], notes:data.notes||[],
            fixed: data.fixed || [], ignored: data.ignored || '', unit:data.unit || '' };
    }else if(AI_STATE==='cloud'||Cloud.paired){
      const data=await cloudCall('ocr',{profileId:Profile,mime:'image/jpeg',image:await cloudPhoto(files[i],blob)});
      j={ok:true,...data};
    }else{
      const r = await fetch('api/ocr', {
        method:'POST',
        headers:{'Content-Type': blob.type || 'image/jpeg'},
        body: blob
      });
      try{ j = await r.json(); }catch(e){ throw new Error('电脑端 AI 服务没有响应（HTTP '+r.status+'）'); }
      if(!j.ok) throw new Error(j.message || j.error || 'AI 识别失败');
    }
    const defaultTier=j.schemaVersion===2?'B':pendingSource==='teacher'?'A':'B';
    acc.words = acc.words.concat((j.words||[]).map(w=>({en:fixEnglishApostrophes(w.en), zh:w.zh||'', kind:'word',tier:ocrTier(w.section||defaultTier)})));
    acc.sentences = acc.sentences.concat((j.sentences||[]).map(s=>({en:fixEnglishApostrophes(s.en), zh:s.zh||'', kind:'sent',tier:ocrTier(s.section||defaultTier)})));
    acc.notes = acc.notes.concat((j.notes||[]).map(n=>String(n.text||'').trim()).filter(Boolean));
    acc.model = j.model || acc.model;
    acc.unit = acc.unit || String(j.unit||'').trim();
    acc.ms = (acc.ms||0) + (j.ms||0);
    if(Array.isArray(j.fixed) && j.fixed.length) acc.fixed = (acc.fixed||[]).concat(j.fixed);
    if(j.ignored) acc.ignored = (acc.ignored ? acc.ignored + '；' : '') + j.ignored;
  }
  /* 本地再兜一道过滤 + 分流：
     直连模式下服务端那两道闸不存在，所以这里必须自己来。
     （局域网模式下重复过滤也无害，幂等） */
  const wRaw=[], sRaw=[];
  for(const w of acc.words){
    if(looksLikeJunk(w.en, w.zh)) continue;
    (sentLike(w.en) ? sRaw : wRaw).push(w);
  }
  for(const s of acc.sentences){
    if(looksLikeJunk(s.en, s.zh)) continue;
    sRaw.push(s);
  }

  // 一段里塞了好几句的，先切开（否则句子排序会一次甩出十几个词）
  const sSplit = [];
  for(const s of sRaw) sSplit.push(...splitMultiSentences(s.en, s.zh).map(x=>({...x,tier:s.tier})));

  // 去重（跨表也算重复）
  const seen=new Set(), W=[], Ss=[];
  for(const w of wRaw){ const k=norm(w.en); if(k && !seen.has(k)){ seen.add(k); W.push({...w, kind:'word'}); } }
  for(const s of sSplit){ const k=norm(s.en); if(k && !seen.has(k)){ seen.add(k); Ss.push({...s, zh: cleanZh(s.zh), kind:'sent'}); } }
  acc.words=W; acc.sentences=Ss; acc.notes=uniq(acc.notes);
  return acc;
}

/* =========================================================
   拍照识别 · 路线二：浏览器内置 OCR（备用，识别弱）
   ========================================================= */
async function ocrImages(files, onProgress){
  if(!await ensureOcrSrc()) throw new Error('OCR 引擎下载失败（可能网络不通）');
  const w = await ensureWorker(onProgress);
  let out='';
  for(let i=0;i<files.length;i++){
    onProgress({status:'recognizing', progress:0, _file:i+1, _total:files.length});
    const r = await w.recognize(files[i]);
    out += (r && r.data && r.data.text ? r.data.text : '') + '\n';
    onProgress({status:'recognizing', progress:1, _file:i+1, _total:files.length});
  }
  return out;
}

/* =========================================================
   上传前裁切：先把不要的部分框掉，再送去识别
   ========================================================= */
const Crop = { queue:[], idx:0, out:[], box:{x:0,y:0,w:0,h:0}, url:null };
let pendingSource='teacher';

function handleFiles(files){
  if(!files || !files.length) return;
  if(ocrBusy){ toast('正在识别，稍等一下'); return; }
  const images=[...files].filter(f=>f.type.startsWith('image/')||(!f.type&&/\.(png|jpe?g|webp|gif|bmp|heic|heif|avif)$/i.test(f.name)));
  if(!images.length){ toast('请拖入图片文件'); return; }
  if(images.length!==files.length) toast('已跳过非图片文件');
  pendingSource=$('#sourceType')?.value||'teacher';
  Crop.queue = images;
  Crop.idx = 0;
  Crop.out = [];
  go('crop');
}
function cleanupCropUrl(){
  if(Crop.url){ try{ URL.revokeObjectURL(Crop.url); }catch(e){} Crop.url=null; }
}
function cancelCrop(){
  cleanupCropUrl();
  Crop.queue=[]; Crop.out=[];
  go('home');
}
function cropAdvance(){
  cleanupCropUrl();
  Crop.idx++;
  if(Crop.idx >= Crop.queue.length) return cropFinish();
  renderCropStep();
}
function cropSkipRest(){
  cropToBlob(true).then(blob=>{
    if(blob) Crop.out.push(blob);
    while(Crop.idx < Crop.queue.length){ Crop.out.push(Crop.queue[Crop.idx]); Crop.idx++; }
    cropFinish();
  });
}
function cropFinish(){
  cleanupCropUrl();
  const list = Crop.out.slice();
  Crop.queue=[]; Crop.out=[];
  if(!list.length){ toast('没有可识别的内容'); go('home'); return; }
  ocrBusy = true;
  doRecognize(list).finally(()=>{ ocrBusy = false; });
}
async function cropToBlob(useAll){
  const img = $('#cropImg');
  if(!img || !img.naturalWidth) return null;
  const dw = img.offsetWidth, dh = img.offsetHeight;
  const s  = img.naturalWidth / dw;
  const b  = useAll ? {x:0,y:0,w:dw,h:dh} : Crop.box;
  const sx = Math.max(0, Math.round(b.x*s)), sy = Math.max(0, Math.round(b.y*s));
  const sw = Math.max(1, Math.min(Math.round(b.w*s), img.naturalWidth  - sx));
  const sh = Math.max(1, Math.min(Math.round(b.h*s), img.naturalHeight - sy));
  const c = document.createElement('canvas');
  c.width = sw; c.height = sh;
  const ctx = c.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,sw,sh);
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  return await new Promise(res=>{ c.toBlob(x=>res(x||null), 'image/jpeg', 0.9); });
}

function renderCropStep(){
  const f = Crop.queue[Crop.idx];
  if(!f){ cropFinish(); return; }
  cleanupCropUrl();
  Crop.url = URL.createObjectURL(f);
  const n = Crop.queue.length;

  $('#wrap').innerHTML = `<div class="screen">
    <div class="card">
      <h2>✂️ 只留要用的部分</h2>
      <p class="sub">拖动方框：把页眉、题目要求、插图、别的科目都框在外面。<b>框里留下的才会送去识别。</b></p>
      ${n>1?`<div class="cropthumbs">${Crop.queue.map((_,i)=>`<span class="${i===Crop.idx?'on':''}">第 ${i+1} 张</span>`).join('')}</div>`:''}
    </div>
    <div class="cropstage">
      <div class="cropwrap" id="cropWrap">
        <img id="cropImg" src="${Crop.url}" alt="">
        <div class="cropbox" id="cropBox">
          <i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i>
        </div>
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn ghost" id="cropAll">用整张</button>
      <button class="btn primary" id="cropOk">✅ 就裁这里</button>
    </div>
    ${n>1?`<button class="btn sm ghost" id="cropSkipRest" style="margin-top:10px">后面的都不裁，直接识别</button>`:''}
    <button class="btn sm ghost" id="cropCancel" style="margin-top:10px">取消，重新选照片</button>
  </div>`;

  const img=$('#cropImg'), box=$('#cropBox');
  function paint(){
    const W=img.offsetWidth, H=img.offsetHeight; if(!W) return;
    const b=Crop.box;
    b.w = Math.max(60, Math.min(b.w, W));
    b.h = Math.max(60, Math.min(b.h, H));
    b.x = Math.max(0, Math.min(b.x, W-b.w));
    b.y = Math.max(0, Math.min(b.y, H-b.h));
    box.style.left=b.x+'px'; box.style.top=b.y+'px';
    box.style.width=b.w+'px'; box.style.height=b.h+'px';
  }
  const init = ()=>{ const W=img.offsetWidth,H=img.offsetHeight; if(!W) return;
    Crop.box={x:0,y:0,w:W,h:H}; paint(); };
  if(img.complete && img.naturalWidth) init(); else img.onload = init;

  let drag=null;
  box.addEventListener('pointerdown', e=>{
    const h = (e.target.dataset && e.target.dataset.h) || 'move';
    drag = {mode:h, sx:e.clientX, sy:e.clientY, ox:Crop.box.x, oy:Crop.box.y, ow:Crop.box.w, oh:Crop.box.h};
    try{ box.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault(); e.stopPropagation();
  });
  box.addEventListener('pointermove', e=>{
    if(!drag) return;
    const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy, b=Crop.box;
    if(drag.mode==='move'){ b.x=drag.ox+dx; b.y=drag.oy+dy; }
    else{
      let x=drag.ox, y=drag.oy, w=drag.ow, h=drag.oh;
      if(drag.mode[0]==='n'){ y=drag.oy+dy; h=drag.oh-dy; }
      if(drag.mode[0]==='s'){ h=drag.oh+dy; }
      if(drag.mode[1]==='w'){ x=drag.ox+dx; w=drag.ow-dx; }
      if(drag.mode[1]==='e'){ w=drag.ow+dx; }
      if(w>=60){ b.x=x; b.w=w; }
      if(h>=60){ b.y=y; b.h=h; }
    }
    paint(); e.preventDefault();
  });
  const endDrag = ()=>{ drag=null; };
  box.addEventListener('pointerup', endDrag);
  box.addEventListener('pointercancel', endDrag);
  box.addEventListener('lostpointercapture', endDrag);

  $('#cropAll').onclick = async ()=>{ const b=await cropToBlob(true);  if(b) Crop.out.push(b); cropAdvance(); };
  $('#cropOk').onclick  = async ()=>{ const b=await cropToBlob(false); if(b) Crop.out.push(b); cropAdvance(); };
  $('#cropCancel').onclick = cancelCrop;
  if($('#cropSkipRest')) $('#cropSkipRest').onclick = cropSkipRest;
}

async function doRecognize(files){
  // 裁切/核对等页面里没有首页那条进度条 —— 先回到首页，否则一取就是 null
  if(!$('#ocrBar')) go('home');
  const bar=$('#ocrBar'), fill=$('#ocrFill'), msg=$('#ocrMsg'), acts=$('#ocrActions');
  bar.classList.remove('hide');
  if(acts) acts.innerHTML='';
  fill.style.width='3%';
  const list = [...files];

  /* ---------- 永远先试 AI ----------
     不在页面打开那一刻就把路堵死：那一刻服务可能正好没起来/在重启，
     旧写法会因此把整页永久判成「没有 AI」，然后偷偷用弱引擎糊弄，
     用户看到的就是一堆乱码还不知道为什么。 */
  try{
    msg.textContent = '正在压缩照片…';
    const r = await aiOcr(list, m=>{
      if(m._stage==='shrink'){ msg.textContent='正在压缩照片 '+m._file+'/'+m._total+'…'; fill.style.width=(10+m._file/m._total*15)+'%'; }
      else if(m._stage==='upload'){ msg.textContent='AI 正在读图 '+m._file+'/'+m._total+'…（约 5-10 秒）'; fill.style.width=(30+m._file/m._total*60)+'%'; }
    });
    if(!r.words.length && !r.sentences.length && !r.notes.length) throw new Error('图片里没读出学习内容');
    const candidate={source:pendingSource,title:'',notes:r.notes||[],
      words:r.words.map(w=>({...w,on:true})),
      sents:r.sentences.map(s=>({...s,on:true,key:pickKey(s.en)})),
      unit:String(r.unit||'').trim().slice(0,40),ignored:r.ignored||'',fixed:r.fixed||[]};
    $('#rawText').value = [
      ...r.words.map(w=>w.en + (w.zh? '  '+w.zh : '')),
      ...r.sentences.map(s=>s.en + (s.zh? '  '+s.zh : ''))
    ].join('\n');
    fill.style.width='100%';
    const aSentences=r.sentences.filter(x=>x.tier==='A').length;
    msg.innerHTML = '✅ AI 识别完成 &nbsp;·&nbsp; 单词 <b>'+r.words.length+'</b> 个，句子 <b>'+r.sentences.length+'</b> 句';
    setTimeout(()=>bar.classList.add('hide'), 900);
    toast(pendingSource==='teacher'&&!aSentences?'A 类句子未读到，请在核对页补充':'识别完成',3500);
    AI_STATE='ready'; AI_LAST_ERROR='';
    importMaterial(candidate);
    return;
  }catch(err){
    AI_STATE = 'degraded';
    AI_LAST_ERROR = (err && err.message) ? err.message : String(err);
  }

  /* ---------- AI 没成功：明说，让你选，绝不偷偷用弱引擎 ---------- */
  fill.style.width='100%';
  msg.innerHTML =
    '<b style="color:#B91C1C">❌ AI 识别没成功</b><br>' +
    '<span style="font-size:12.5px">' + esc(AI_LAST_ERROR) + '</span>';
  if(acts){
    acts.innerHTML =
      '<button class="btn sm amber" id="ocrRetry">🔁 再试一次</button>' +
      '<button class="btn sm ghost" id="ocrManual">✍️ 手动粘贴文字</button>';
    $('#ocrRetry').onclick = ()=>{ bar.classList.add('hide'); acts.innerHTML=''; ocredPick(); };
    $('#ocrManual').onclick = ()=>{
      bar.classList.add('hide'); acts.innerHTML='';
      const t=$('#rawText'); t.focus(); t.scrollIntoView({block:'center'});
      toast('在下面的框里粘贴文字，再点「开始」');
    };
    const warn = document.createElement('button');
    warn.className='btn sm ghost';
    warn.style.cssText='grid-column:1/-1;font-size:13px;color:#92400E;border-color:#FCD34D;background:#FFFBEB';
    warn.textContent='⚠️ 还是用备用识别（中文经常乱码，不推荐）';
    warn.onclick = ()=>{ acts.innerHTML=''; runFallback(list); };
    acts.appendChild(warn);
  }
  fill.style.width='0%';
  toast('AI 识别失败，请看下面的选项');
}

/* ---------- 备用识别：只在用户明确点了才用 ---------- */
async function runFallback(list){
  const bar=$('#ocrBar'), fill=$('#ocrFill'), msg=$('#ocrMsg');
  bar.classList.remove('hide');
  fill.style.width='5%';
  try{
    msg.textContent='正在启动备用识别…（第一次要加载约 4.5MB）';
    const text = await ocrImages(list, m=>{
      if(!m) return;
      if(m.status==='loading tesseract core'){ msg.textContent='加载识别核心…'; fill.style.width='12%'; }
      else if(m.status==='loading language traineddata'){ msg.textContent='加载语言包… '+Math.round((m.progress||0)*100)+'%'; fill.style.width=(15+(m.progress||0)*45)+'%'; }
      else if(m.status==='initializing api'){ msg.textContent='初始化…'; fill.style.width='65%'; }
      else if(m.status==='recognizing text'){
        const f = m._file?('第 '+m._file+'/'+m._total+' 张 '):'';
        msg.textContent='正在识别 '+f+Math.round((m.progress||0)*100)+'%';
        fill.style.width=(70+(m.progress||0)*29)+'%';
      }
      else if(m.status==='retry'){ msg.textContent='正在准备识别…'; }
    });
    fill.style.width='100%';
    msg.innerHTML='备用识别完成 <span style="color:#B45309">（中文可能不准，请仔细核对）</span>';
    const cur = $('#rawText').value.trim();
    $('#rawText').value = (cur? cur+'\n':'') + text.trim();
    setTimeout(()=>bar.classList.add('hide'), 1500);
    toast('备用识别完成，请核对');
  }catch(err){
    fill.style.width='100%';
    msg.innerHTML = '<b style="color:#B91C1C">备用识别也没成功</b>：' + esc(err.message||'网络问题') +
      '<br>用 iPad 长按图片「拷贝文字」，粘到下面的框里，一样能用。';
    toast('识别失败，可手动粘贴文字');
  }
}

function applyParse(text, preview){
  const r = parseBlocks(text);
  if(!r.words.length && !r.sents.length){ toast('没识别出英文内容，检查一下'); return; }
  const previous=new Map([...S.words,...S.sents].map(x=>[norm(x.en),x.tier]));
  const source=preview?($('#sourceType')?.value||'other'):S.source;
  const fallbackTier=preview?'B':source==='teacher'?'A':'B';
  const candidate={source,title:preview?'':S.title,notes:preview?[]:S.notes,
    words:r.words.map(w=>({...w,on:true,tier:preview?fallbackTier:previous.get(norm(w.en))||fallbackTier})),
    sents:r.sents.map(s=>({...s,on:true,tier:preview?fallbackTier:previous.get(norm(s.en))||fallbackTier,key:pickKey(s.en)})),
    unit:(String(text).match(/\b(?:[3-6]A\s*)?Unit\s*\d+\b/i)||[])[0] || (preview?'':S.unit)};
  if(preview) importMaterial(candidate);
  else {S.words=candidate.words;S.sents=candidate.sents;S.unit=candidate.unit;S.done={};clearRun();saveSession();}
}

/* 本地兜底的"看着不像正常单词"检查 —— 模型自查漏了的，这里还能捞出来 */
function suspiciousWord(en){
  const bare = String(en||'').replace(/[^A-Za-z]/g,'');
  if(bare.length >= 22) return '太长，可能是两行粘在一起';
  if(bare.length >= 4 && !/[aeiou]/i.test(bare)) return '一个元音都没有，可能认错了';
  if(/(.)\1\1/i.test(bare)) return '连续三个相同字母，可能认错了';
  return '';
}

const CAP = 10;
function take(arr,n){ const s=shuffle(arr); return s.slice(0, Math.min(n, s.length)); }

/* ---------- 句子排序的"能不能用"判断 ----------
   孩子要拿词块拼句子，所以：太长排不动、有缩写会拆出单字母、有碎片会漏块。
   这些一律不出题（那句话仍然会出现在句子填空和默写里）。 */
const ABBR_RE = /\b(e\.g|i\.e|etc|Mr|Mrs|Ms|Dr|St|vs|No|Fig|Ph)\./i;
function orderTokens(en){
  return (String(en||'').match(/[A-Za-z0-9'\-]+/g) || []);
}
function orderCleanTokens(en){
  return orderTokens(en).filter(t => /^([aAiI]|\d+)$/.test(t) || t.length > 1);
}
function orderOK(en){
  const s = String(en||'').trim();
  if(ABBR_RE.test(s)) return false;                       // 含 e.g. / Mr. 之类，会拆出单字母
  const all = orderTokens(s);
  const clean = orderCleanTokens(s);
  if(clean.length !== all.length) return false;           // 有被丢掉的碎片，不用
  return clean.length >= 3 && clean.length <= 9;          // 3~9 个词最舒服
}
function orderPool(){
  return S.sents.filter(x => x.on && x.tier==='A' && x.en && orderOK(x.en));
}

/* 中文释义里常混进「例如：…」这类课本说明，砍掉 */
function cleanZh(zh){
  let z = String(zh||'').trim();
  z = z.replace(/[（(]?\s*(例如|比如|例|如)\s*[:：][\s\S]*$/,'').trim();
  z = z.replace(/[（(]?\s*e\.?g\.?\s*[:：][\s\S]*$/i,'').trim();
  return z;
}

function distractors(correct, pool, n){
  const c = norm(correct);
  const cand = uniq(pool.map(x=>x).filter(x=>norm(x)!==c && x && norm(x).length>0));
  const pick = shuffle(cand).slice(0,n);
  while(pick.length<n){
    const p = POOL[Math.random()*POOL.length|0];
    if(norm(p)!==c && !pick.some(x=>norm(x)===norm(p))) pick.push(p);
  }
  return pick;
}
function buildQuestions(levelId){
  const W = S.words.filter(x=>x.on && x.en && x.tier!=='C');
  const Ss= S.sents.filter(x=>x.on && x.en && x.tier!=='C');
  const AW=W.filter(x=>x.tier==='A'), AS=Ss.filter(x=>x.tier==='A');
  const wPool = W.map(x=>x.en);
  const sPool = Ss.map(x=>x.key).filter(Boolean);
  const hard = Store.grade>=5;

  if(levelId==='choose'){
    return take(W,CAP).map(w=>{
      const opts = shuffle([w.en, ...distractors(w.en, wPool, 3)]);
      return {kind:'choose', zh:w.zh||'（没有中文）', answer:w.en, options:opts, entry:w};
    });
  }
  if(levelId==='spell'){
    return take(AW, hard?CAP:8).map(w=>({kind:'spell', zh:w.zh||'（没有中文）', answer:w.en, entry:w}));
  }
  if(levelId==='listen'){
    return take(W,CAP).map(w=>{
      const opts = shuffle([w.en, ...distractors(w.en, wPool, 3)]);
      return {kind:'listen', answer:w.en, options:opts, zh:w.zh||'', entry:w};
    });
  }
  if(levelId==='cloze'){
    return take(Ss.filter(s=>s.key), hard?8:6).map(s=>{
      const k = s.key;
      const opts = shuffle([k, ...distractors(k, [...sPool, ...wPool], 3)]);
      return {kind:'cloze', answer:k, options:opts, zh:s.zh||'', full:s.en, entry:s};
    });
  }
  if(levelId==='order'){
    return take(orderPool(), hard?8:6).map(s=>{
      const words = orderCleanTokens(s.en);        // 只含完整单词，不会出现 e / g 这种碎片
      return {kind:'order', answer:s.en, tokens:shuffle(words), words, zh:cleanZh(s.zh)||s.zh||'', entry:s};
    });
  }
  if(levelId==='write'){
    const qs=[];
    take(AW, Math.min(CAP, AW.length)).forEach(w=>qs.push({kind:'write', type:'word', zh:w.zh||'（没有中文）', answer:w.en, entry:w}));
    take(AS, Math.min(hard?6:4, AS.length)).forEach(s=>qs.push({kind:'write', type:'sent', zh:s.zh||'（没有中文）', answer:s.en, entry:s}));
    return shuffle(qs);
  }
  return [];
}

/* =========================================================
   闯关引擎
   ========================================================= */
const Run = {id:null, qs:[], i:0, stars:0, right:0, combo:0, locked:false, tries:0, qSeq:0};
const MAX_TRIES = 3;

/* =========================================================
   断点续做：内容、完成情况、正在做的那一关，全部落盘
   （误触返回、Safari 自己刷新、切换 App 回来，都不会丢）
   ========================================================= */
const KS = {session:profileKey('dxxg.session'), run:profileKey('dxxg.run'),
  materials:profileKey('dxxg.materials.v1')};
const SOURCE_NAMES={teacher:'老师知识梳理',textbook:'课本',worksheet:'练习资料',other:'其他'};
function materialList(){
  const rows=load(KS.materials,[]);
  return Array.isArray(rows)?rows:[];
}
function materialKeys(row){
  return new Set([...(row.words||[]).map(x=>'w:'+norm(x.en)),...(row.sents||[]).map(x=>'s:'+norm(x.en))].filter(x=>x.length>2));
}
function materialDuplicate(candidate){
  const keys=materialKeys(candidate);
  if(keys.size<3) return null;
  const unit=String(candidate.unit||'').replace(/\s+/g,'').toLowerCase();
  let best=null;
  for(const row of materialList()){
    const otherUnit=String(row.unit||'').replace(/\s+/g,'').toLowerCase();
    if(unit&&otherUnit&&unit!==otherUnit) continue;
    const prior=materialKeys(row);
    const common=[...keys].filter(x=>prior.has(x)).length;
    const total=Math.max(keys.size,prior.size);
    const exact=common===keys.size&&common===prior.size&&common>=3;
    const near=common>=4&&common/total>=.8&&row.source===candidate.source&&!!unit&&unit===otherUnit;
    if(!exact&&!near) continue;
    const match={row,exact,ratio:Math.round(common/total*100)};
    if(exact) return match;
    if(!best||match.ratio>best.ratio) best=match;
  }
  return best;
}
function importMaterial(candidate){
  const open=row=>{clearRun();loadMaterial(row);saveSession();go('review');toast('这份资料已有，已打开原资料');};
  const create=()=>{
    clearRun(); S.materialId=''; S.source=candidate.source; S.title=candidate.title; S.notes=candidate.notes;
    S.words=candidate.words; S.sents=candidate.sents; S.unit=candidate.unit; S.done={};
    S.ignored=candidate.ignored||''; S.fixed=candidate.fixed||[];
    saveSession();go('review');
  };
  const match=materialDuplicate(candidate);
  if(match?.exact){open(match.row);return;}
  if(match){
    showModal('发现相似资料','已有 <b>'+esc(match.row.unit||match.row.title||'一份资料')+'</b>，词句约 '+match.ratio+'% 相同。',[
      {t:'打开已有',primary:true,fn:()=>open(match.row)},
      {t:'另存新资料',fn:create}
    ],true);
    return;
  }
  create();
}
function removeMaterial(id){
  const rows=materialList().filter(x=>x.id!==id);
  if(rows.length===materialList().length) return;
  try{localStorage.setItem(KS.materials,JSON.stringify(rows));}
  catch(e){toast('移除失败，请先导出备份');return;}
  if(S.materialId===id){
    clearRun();
    const next=rows.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];
    if(next){loadMaterial(next);saveSession();}else clearActiveMaterial();
  }
  queueCloudSync();go('home');toast('资料已移除，学习记录保留');
}
function materialSnapshot(){
  return {id:S.materialId,source:S.source,title:S.title,notes:S.notes,
    words:S.words,sents:S.sents,done:S.done,unit:S.unit,updatedAt:Date.now()};
}
function loadMaterial(d){
  S.words=(Array.isArray(d.words)?d.words:[]).map(x=>({...x,tier:['A','B','C'].includes(x.tier)?x.tier:'A'}));
  S.sents=(Array.isArray(d.sents)?d.sents:[]).map(x=>({...x,tier:['A','B','C'].includes(x.tier)?x.tier:'A'}));
  S.done=d.done||{}; S.unit=String(d.unit||'').slice(0,40);
  S.materialId=d.id||('m-'+Date.now().toString(36));
  S.source=SOURCE_NAMES[d.source]?d.source:'teacher';
  S.title=String(d.title||'').slice(0,60);
  S.notes=Array.isArray(d.notes)?d.notes:[];
}
function clearActiveMaterial(){
  S.words=[]; S.sents=[]; S.unit=''; S.done={}; S.materialId=''; S.title=''; S.notes=[];
  try{localStorage.removeItem(KS.session);}catch(e){}
  clearRun();
}
function saveSession(){
  if(!S.words.length&&!S.sents.length&&!S.notes.length) return;
  if(!S.materialId) S.materialId='m-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
  const entry=materialSnapshot();
  try{
    localStorage.setItem(KS.session,JSON.stringify(entry));
    const rows=materialList(), at=rows.findIndex(x=>x.id===entry.id);
    if(at<0) rows.push(entry); else rows[at]=entry;
    localStorage.setItem(KS.materials,JSON.stringify(rows));
    queueCloudSync();
  }catch(e){ toast('本机空间不足，资料未保存；请导出备份'); }
}
function restoreSession(){
  const d = load(KS.session, null)||materialList().sort((a,b)=>b.updatedAt-a.updatedAt)[0];
  if(!d) return false;
  const w = Array.isArray(d.words)?d.words:[];
  const s = Array.isArray(d.sents)?d.sents:[];
  if(!w.length && !s.length && !(Array.isArray(d.notes)&&d.notes.length)) return false;
  loadMaterial(d); saveSession();
  return true;
}
function saveRun(){
  if(!Run.id || !Run.qs || !Run.qs.length || Run.i >= Run.qs.length){ save(KS.run, null); return; }
  save(KS.run, {id:Run.id, qs:Run.qs, i:Run.i, stars:Run.stars, right:Run.right});
}
function restoreRun(){
  const d = load(KS.run, null);
  if(!d || !d.id || !Array.isArray(d.qs) || !d.qs.length) return false;
  if(!(d.i >= 0) || d.i >= d.qs.length) return false;
  Run.id=d.id; Run.qs=d.qs; Run.i=d.i; Run.stars=d.stars||0; Run.right=d.right||0;
  Run.combo=0; Run.locked=false;
  return true;
}
function clearRun(){ Run.id=null; Run.qs=[]; Run.i=0; Run.stars=0; Run.right=0; save(KS.run, null); }

/* 中途退出：说清楚进度会保留，给三个明确选择 */
function exitLevel(){
  if(!Run.id || Run.i>=Run.qs.length){ clearRun(); go('levels'); return; }
  const lv = LEVELS.find(l=>l.id===Run.id) || {nm:'这一关'};
  showModal('要休息一下吗？',
    `${lv.nm}　做到第 ${Run.i+1} / ${Run.qs.length} 题\n进度会保留，下次点「继续」就能接着做。`,
    [
      {t:'继续做', primary:true},
      {t:'保存并退出', fn:()=>{ saveRun(); go('levels'); toast('进度已保留'); }},
      {t:'不要这关了', danger:true, fn:()=>{ clearRun(); S.done[Run.id]=undefined; go('levels'); }}
    ]);
}
function startLevel(id, overrideQs){
  if(id==='write' && !overrideQs){ Dict.from='levels'; Dict.source='current'; go('dictation'); return; }
  const qs = overrideQs || buildQuestions(id);
  if(!qs.length){ toast('这一关还没有足够的题目'); return; }
  S.lastWrong = [];
  Run.id=id; Run.qs=qs; Run.i=0; Run.stars=0; Run.right=0; Run.combo=0; Run.locked=false;
  saveSession();                 // 兜底：连内容一起落盘，断点才不会指向不存在的内容
  go('play');
  renderQ();
}
function playHeader(extra){
  const lv = LEVELS.find(l=>l.id===Run.id)||{icon:'🎮',nm:''};
  const left = Math.max(0, MAX_TRIES - (Run.tries||0));
  return `<div class="pbar">
    <button class="bar-btn" id="qBack">←</button>
    <div class="progress"><i style="width:${(Run.i/Run.qs.length*100).toFixed(1)}%"></i></div>
    <div class="cnt">${Run.i+1}/${Run.qs.length} · ⭐${Run.stars}</div>
  </div>
  <div class="center" style="margin-bottom:8px;font-size:13px;color:#6B7280;font-weight:800">${lv.icon} ${lv.nm}</div>
  <div class="escapebar">
    <span class="tries">机会 <b id="tryLeft">${left}</b>/${MAX_TRIES}</span>
    <button class="btn sm ghost" id="btnGiveUp">🆘 我卡住了，看答案</button>
  </div>
  ${extra||''}`;
}
function renderQ(){
  const q = Run.qs[Run.i];
  Run.qSeq++;
  Run.locked=false;
  Run.tries=0;                                 // 每道题 3 次机会，重新开始数
  Run.reveal=null;
  stopSpeak();                                 // 换题先掐断上一条语音，绝不让它串到下一题
  saveRun();                                   // 每换一题就落盘，误触返回也丢不了
  ({choose:vChoose, spell:vSpell, listen:vListen, cloze:vCloze, order:vOrder, write:vWrite}[q.kind])(q);
  bindGiveUp();
}
function bindGiveUp(){
  const b=$('#btnGiveUp'); if(b) b.onclick = giveUp;
}
function refreshTryLeft(){
  const el=$('#tryLeft'); if(el) el.textContent = Math.max(0, MAX_TRIES - (Run.tries||0));
}
/* 兜底出口：孩子卡住了（排不完 / 拼不完 / 就是不会），随时能看答案走人。
   代价是这题不给星，也不影响后面。 */
function giveUp(){
  if(Run.locked) return;
  const q = Run.qs[Run.i]; if(!q) return;
  Run.locked = true;
  scoreMark(false);
  markWrong(q.entry, q.kind);
  if(typeof Run.reveal === 'function'){ try{ Run.reveal(); }catch(e){} }
  const sayText = q.kind==='cloze' ? (q.full||q.answer) : q.answer;
  speakWait(sayText, .75);
  showNextBar(sayText);
  toast('没关系，看懂了再往下走 💪', 1800);
}
function bindBack(){
  const b=$('#qBack'); if(b) b.onclick=exitLevel;
}
function gotoNext(delay){
  setTimeout(()=>{
    Run.i++;
    if(Run.i>=Run.qs.length) return finishLevel();
    renderQ();
  }, delay==null ? 620 : delay);
}
/* 答完一题的统一收尾：先给"对"的视觉反馈（立刻），再播报，播完停 1 秒才翻页 */
function finishAnswer(sayText, rate){
  if(!sayText){ gotoNext(620); return; }
  speakWait(sayText, rate).then(()=>gotoNext(1000));
}

/* =========================================================
   答错不再直接冲走：给 3 次机会，第 3 次才公布答案，
   然后停下来等用户自己点「下一题」——留足时间消化。
   ========================================================= */
function onWrongAnswer(q, sayText, revealFn, hintFn, why){
  Run.tries = (Run.tries||0) + 1;
  refreshTryLeft();
  if(Run.tries < MAX_TRIES){
    beep('bad');
    if(hintFn && Run.tries >= 2) hintFn();          // 第 2 次失败给个提示（比如排掉一个错选项）
    const left = MAX_TRIES - Run.tries;
    const tail = left === 1 ? '最后一次机会，加油！' : ('还有 ' + left + ' 次机会');
    toast((why ? why + '，' : '再想想，') + tail, 1600);
    return false;                                    // 留在原地重试
  }
  // 第 3 次：公布答案 + 念正确语音 + 出现「下一题」按钮
  Run.locked = true;
  scoreMark(false);
  markWrong(q.entry, q.kind);
  if(revealFn) revealFn();
  speakWait(sayText, .75);
  showNextBar(sayText);
  toast('没关系，记住它就够了 💪', 1800);
  return true;
}
function showNextBar(sayText){
  const box = $('#afterBox'); if(!box) return;
  const last = Run.i >= Run.qs.length-1;
  box.innerHTML = `<div class="row" style="margin-top:14px">
      <button class="btn sm ghost" id="btnReplay">🔊 再听一遍</button>
      <button class="btn primary" id="btnNextQ">${last?'看成绩 🏁':'我记住了，下一题 →'}</button>
    </div>`;
  $('#btnReplay').onclick = ()=>{ if(sayText) speakWait(sayText, .75); };
  $('#btnNextQ').onclick  = ()=>{ gotoNext(0); };
  try{ box.scrollIntoView({block:'nearest', behavior:'smooth'}); }catch(e){}
}
function scoreMark(ok, firstTry){
  if(ok){
    Run.right++;
    if(firstTry !== false) Run.stars++;      // 只有一次就答对才给星
    if(firstTry !== false){ Run.combo++; if(Run.combo>=3) combo(Run.combo); }
    beep('ok'); fxStars(Store.grade>=5?2:3);
  } else { Run.combo=0; beep('bad'); }
}

/* ---------- 1. 看中文选英文 ---------- */
function vChoose(q){
  $('#wrap').innerHTML = `<div class="screen">${playHeader()}
    <div class="qcard" id="qc">
      <div class="q-zh">${esc(q.zh)}</div>
      <div class="q-hint">选出对应的英文</div>
      <div class="choice-feedback" id="choiceFeedback" aria-live="polite"></div>
    </div>
    <div class="opts" id="opts">
      ${q.options.map((o,i)=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}
    </div>
    <div id="afterBox"></div>
  </div>`;
  bindBack();
  const reveal = ()=>{ $$('#opts .opt').forEach(x=>{ if(norm(x.dataset.o)===norm(q.answer)) x.classList.add('good'); }); };
  Run.reveal = reveal;
  $$('#opts .opt').forEach(b=>b.onclick=()=>{
    if(Run.locked) return;
    const ok = norm(b.dataset.o)===norm(q.answer);
    if(!ok){
      // 防作弊：选错的那个直接禁用（不能对同一个选项反复乱点凑次数）
      b.classList.add('bad'); b.disabled = true;
      onWrongAnswer(q, q.answer, reveal);
      return;
    }
    Run.locked=true;
    b.classList.add('good');
    scoreMark(true, Run.tries===0);
    const seq=Run.qSeq, at=Run.i;
    const active=()=>route==='play'&&Run.id==='choose'&&Run.i===at&&Run.qSeq===seq;
    $('#choiceFeedback').textContent='🔊 听英文 × '+Settings.choiceRepeats;
    void (async()=>{
      for(let repeat=0;repeat<Settings.choiceRepeats;repeat++){
        await speakWait(q.answer,.75);
        if(!active()) return;
      }
      $('#choiceFeedback').innerHTML=Settings.choicePause+' 秒后下一题<div class="choice-next-track"><i></i></div>';
      $('#choiceFeedback .choice-next-track i').style.setProperty('--choice-pause',Settings.choicePause+'s');
      setTimeout(function advance(){
        if(!active()) return;
        if($('#modal')){ setTimeout(advance,100); return; }
        Run.i++;
        if(Run.i>=Run.qs.length) finishLevel(); else renderQ();
      },Settings.choicePause*1000);
    })();
  });
}

/* ---------- 2. 字母拼图 ---------- */
const VOWELS = 'aeiou';
const isVowel = ch => VOWELS.indexOf(String(ch).toLowerCase()) >= 0;

function vSpell(q){
  const ans = q.answer;
  /* 多词答案（want to do sth / look after …）中间必须有空格：
     把答案拆成「字母位 + 空格位」的模式，空格位直接显示出来。 */
  const words = ans.split(/\s+/).map(w=>w.replace(/[^A-Za-z'’]/g,'')).filter(Boolean);
  const list  = words.length ? words : [ans.replace(/[^A-Za-z'’]/g,'')];
  const pattern = [];                       // {t:'L',ch,i} | {t:'S'}
  let li = 0;
  list.forEach((w, wi)=>{
    if(wi>0) pattern.push({t:'S'});
    w.split('').forEach(ch=>pattern.push({t:'L', ch, i:li++}));
  });
  const letters = pattern.filter(p=>p.t==='L').map(p=>p.ch);
  const N = letters.length;
  const wordCount = list.length;

  // built 与字母位一一对应：null 或 {c,id,fixed}
  let built = new Array(N).fill(null);
  let hinted = false;                       // 是否已经用了辅音提示
  const answerStr = letters.join('').toLowerCase();

  // 长单词才给「辅音提示」：有元音也有辅音、且够长
  const hasV = letters.some(isVowel), hasC = letters.some(c=>!isVowel(c));
  const canConsonantHint = N >= 6 && hasV && hasC;

  function freshPool(){
    let p = shuffle(letters.map((c,i)=>({c, id:i})));
    if(uniq(letters.map(l=>l.toLowerCase())).length<=2 && N<=4){
      shuffle('etaosrin'.split('')).slice(0,2).forEach((c,i)=>p.push({c, id:1000+i}));
      p = shuffle(p);
    }
    return p;
  }
  let pool = freshPool();
  const emptyIdx = ()=> built.findIndex(b=>!b);

  $('#wrap').innerHTML = `<div class="screen">${playHeader()}
    <div class="qcard">
      <div class="q-zh">${esc(q.zh)}</div>
      <div class="q-hint">${wordCount>1
        ? `<b style="color:#B45309">${wordCount} 个单词</b> · 共 ${N} 个字母 · 单词之间要空格`
        : `${N} 个字母`}${canConsonantHint?' &nbsp;·&nbsp; 长单词，可以点下面的「给辅音」':''}</div>
    </div>
    <div class="row" style="margin-bottom:12px">
      <button class="btn sm primary" id="btnSay">🔊 听发音</button>
      ${canConsonantHint?'<button class="btn sm amber" id="btnCons">🔤 给辅音，我填元音</button>':''}
    </div>
    <div class="slots" id="slots"></div>
    <div class="tiles" id="tiles">
      ${pool.map(t=>`<button class="tile" data-id="${t.id}" data-c="${esc(t.c)}">${esc(t.c.toLowerCase())}</button>`).join('')}
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn sm ghost" id="btnUndo">⌫ 退一格</button>
      <button class="btn sm ghost" id="btnClear">🧹 全清</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn sm" id="btnHint">💡 提示首字母</button>
      <button class="btn sm primary" id="btnCheck">✅ 检查</button>
    </div>
    <div id="afterBox"></div>
  </div>`;
  bindBack();

  const slots=$('#slots');
  function draw(){
    slots.innerHTML = pattern.map(p=>{
      if(p.t==='S') return '<div class="slot sp" title="空格">␣</div>';
      const b = built[p.i];
      if(!b) return '<div class="slot"></div>';
      return `<div class="slot filled${b.fixed?' fixed':''}">${esc(b.c.toLowerCase())}</div>`;
    }).join('');
    $$('#tiles .tile').forEach(t=>t.classList.toggle('used', built.some(b=>b && String(b.id)===t.dataset.id)));
  }
  function renderTiles(){
    $('#tiles').innerHTML = pool.map(t=>`<button class="tile" data-id="${t.id}" data-c="${esc(t.c)}">${esc(t.c.toLowerCase())}</button>`).join('');
    $$('#tiles .tile').forEach(t=>t.onclick=()=>tap(t));
    draw();
  }
  function tap(t){
    if(Run.locked) return;
    const k = emptyIdx();
    if(k < 0) return;
    built[k] = {id:t.dataset.id, c:t.dataset.c};
    draw(); beep('tap');
    if(emptyIdx() < 0) check(true);
  }

  /* 语音：这一关本来就是"听音拼词"，进题目自动念一次，随时可重听 */
  const say = ()=> speakWait(q.answer, .74);
  $('#btnSay').onclick = say;
  // 公布答案 = 把正确拼写摆出来（卡住时和错满 3 次时都用这个）
  const revealSpell = ()=>{ built = letters.map((c,i)=>({id:'R'+i, c, fixed:true})); draw(); };
  Run.reveal = revealSpell;

  /* 长单词给辅音：把辅音直接填好并锁住，字母块只剩元音（+2 个干扰元音） */
  if($('#btnCons')) $('#btnCons').onclick = ()=>{
    if(Run.locked || hinted) return;
    hinted = true;
    letters.forEach((c,i)=>{ if(!isVowel(c)) built[i] = {c, id:'F'+i, fixed:true}; });
    const vs = letters.filter(isVowel);
    let vp = vs.map((c,i)=>({c, id:'V'+i}));
    shuffle('aeiou'.split('')).slice(0,2).forEach((c,i)=>vp.push({c, id:'X'+i}));
    pool = shuffle(vp);
    $('#btnCons').disabled = true;
    $('#btnCons').textContent = '🔤 已给辅音';
    renderTiles();
    say();
    toast('辅音已填好，把元音填进去就行', 1600);
  };

  renderTiles();
  say();                                   // 进题目先念一遍，陌生单词也有抓手

  $('#btnUndo').onclick = ()=>{
    if(Run.locked) return;
    for(let i=N-1;i>=0;i--){ if(built[i] && !built[i].fixed){ built[i]=null; break; } }
    draw();
  };
  $('#btnClear').onclick = ()=>{
    if(Run.locked) return;
    for(let i=0;i<N;i++) if(!built[i] || !built[i].fixed) built[i]=null;
    draw();
  };
  $('#btnHint').onclick = ()=>{
    if(Run.locked) return;
    for(let i=0;i<N;i++) if(!built[i] || !built[i].fixed) built[i]=null;
    built[0] = {id:'-1', c:letters[0]};
    draw(); beep('tap'); say();
  };
  $('#btnCheck').onclick = ()=>check(false);

  function check(auto){
    if(Run.locked) return;
    if(emptyIdx() >= 0){
      // 没拼完也算一次"卡住"：不能靠一直不拼完把题目无限拖下去
      onWrongAnswer(q, q.answer, revealSpell, null, '还没拼完');
      return;
    }
    const val = built.map(b=>b.c).join('').toLowerCase();
    const ok = val === answerStr;
    if(!ok){
      const host=$('#slots'); host.classList.add('shake');
      setTimeout(()=>host.classList.remove('shake'),420);
      const ended = onWrongAnswer(q, q.answer, revealSpell);
      if(!ended && auto){
        for(let i=N-1;i>=0;i--){ if(built[i] && !built[i].fixed){ built[i]=null; break; } }
        draw();                              // 自动填满但拼错：退一格给机会改
      }
      return;
    }
    Run.locked=true;
    scoreMark(true, Run.tries===0);
    finishAnswer(q.answer, .74);
  }
}
