function vOrder(q){
  let chosen=[], pool=q.tokens.slice();
  $('#wrap').innerHTML = `<div class="screen">${playHeader()}
    <div class="qcard">
      ${q.zh?`<div class="q-zh small">${esc(q.zh)}</div><div class="q-hint">把下面的词排成正确的句子</div>`
            :`<div class="q-hint">把下面的词排成正确的句子</div>`}
    </div>
    <div class="ans-line" id="ansLine"></div>
    <div class="tokens" id="pool"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn sm ghost" id="btnUndo2">⌫ 退一个</button>
      <button class="btn sm primary" id="btnCheck2">✅ 检查</button>
    </div>
    <div id="afterBox"></div>
  </div>`;
  bindBack();
  function draw(){
    $('#ansLine').innerHTML = chosen.map((w,i)=>`<button class="wt" data-i="${i}">${esc(w && w.t != null ? w.t : w)}</button>`).join('') || '<span style="color:#94A3B8;font-size:14px;align-self:center">点下面的词，按顺序排好…</span>';
    $('#pool').innerHTML = pool.map((w,i)=>`<button class="wt ${w._used?'used':''}" data-i="${i}">${esc(w.t)}</button>`).join('');
    $$('#ansLine .wt').forEach(b=>b.onclick=()=>{ if(Run.locked)return; const i=+b.dataset.i;
      const item=chosen.splice(i,1)[0]; const p=pool.find(x=>x.id===item.id); if(p) p._used=false; draw(); });
    $$('#pool .wt').forEach(b=>b.onclick=()=>{ if(Run.locked)return; const it=pool[+b.dataset.i];
      if(it._used)return; it._used=true; chosen.push({t:it.t,id:it.id}); draw(); beep('tap'); });
  }
  pool = q.tokens.map((t,i)=>({t, id:i, _used:false}));
  draw();
  // 公布答案 = 把正确顺序摆出来
  const revealOrder = ()=>{ $('#ansLine').innerHTML = q.words.map(w=>`<button class="wt">${esc(w)}</button>`).join(''); };
  Run.reveal = revealOrder;
  $('#btnUndo2').onclick=()=>{ if(Run.locked)return; const c=chosen.pop(); if(c){const p=pool.find(x=>x.id===c.id); if(p)p._used=false;} draw(); };
  $('#btnCheck2').onclick=()=>{
    if(Run.locked) return;
    if(chosen.length<q.words.length){
      // 没排完也算一次"卡住"：否则孩子卡在这里永远拿不到答案
      onWrongAnswer(q, q.answer, revealOrder, null, '还没排完');
      if(!Run.locked){ chosen.forEach(c=>{ const p=pool.find(x=>x.id===c.id); if(p) p._used=false; }); chosen=[]; draw(); }
      return;
    }
    const val = chosen.map(x=>x.t).join(' ');
    const ok = norm(val)===norm(q.words.join(' '));
    if(!ok){
      $('#ansLine').classList.add('shake'); setTimeout(()=>$('#ansLine').classList.remove('shake'),420);
      const ended = onWrongAnswer(q, q.answer, revealOrder);
      if(!ended){                                  // 还没到第 3 次：把词放回词池让他重排
        chosen.forEach(c=>{ const p=pool.find(x=>x.id===c.id); if(p) p._used=false; });
        chosen=[]; draw();
      }
      return;
    }
    Run.locked=true;
    scoreMark(true, Run.tries===0);
    finishAnswer(q.answer, .8);
  };
}

function markWrong(entry, kind){
  if(!entry || !entry.en) return;
  const k = norm(entry.en);
  const ex = Store.wrong.find(x=>norm(x.en)===k);
  if(ex){ ex.n=(ex.n||1)+1; ex.ts=Date.now(); ex.zh=entry.zh||ex.zh; }
  else Store.wrong.unshift({en:entry.en, zh:entry.zh||'', kind:kind==='write'?'write':(entry.kind||'word'), n:1, ts:Date.now()});
  Store.wrong = Store.wrong.slice(0,300);
  save(K.wrong, Store.wrong);
  S.lastWrong.push(entry.en);
}

/* ---------- 画布 ---------- */
/* =========================================================
   手写画布
   · 笔 / 橡皮 两种工具，橡皮擦哪儿是哪儿（不是一下全没）
   · 撤销一笔
   · 记录"到底写了多少"（防作弊：没写东西不许自评"写对了"）
   · 格线画在画布后面的独立层，橡皮不会把格线擦掉
   ========================================================= */
const PEN = { color:'#1E3A8A', width:3.6 };
const ERASER_W = 26;
const GUIDE_POS = [0.24, 0.46, 0.74, 0.90];   // 四线三格（上下都留了余量）

function handGuidesHTML(tall){
  return `<div class="guides">${GUIDE_POS.map((p,i)=>
    `<i class="${i===2?'baseline':''}" style="top:${(p*100).toFixed(1)}%"></i>`).join('')}</div>`;
}

function setupCanvas(cv){
  const ctx = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const rect = cv.getBoundingClientRect();
  const w = Math.max(140, rect.width || 320);
  const h = Math.max(140, rect.height || 240);
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap='round'; ctx.lineJoin='round';

  cv._strokes = [];        // [{tool:'pen'|'eraser', pts:[{x,y}]}]
  cv._tool = 'pen';
  cv._ink = 0;             // 累计"笔迹长度"，用来判断是不是真的写了

  const pos = e => { const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  function applyTool(s){
    if(s.tool==='eraser'){
      ctx.globalCompositeOperation='destination-out';
      ctx.lineWidth = ERASER_W; ctx.strokeStyle='rgba(0,0,0,1)'; ctx.fillStyle='rgba(0,0,0,1)';
    }else{
      ctx.globalCompositeOperation='source-over';
      ctx.lineWidth = PEN.width; ctx.strokeStyle = PEN.color; ctx.fillStyle = PEN.color;
    }
  }
  function paintOne(s){
    if(!s.pts.length) return;
    ctx.save(); applyTool(s);
    if(s.pts.length===1){
      ctx.beginPath(); ctx.arc(s.pts[0].x, s.pts[0].y, ctx.lineWidth/2, 0, Math.PI*2); ctx.fill();
    }else{
      ctx.beginPath(); ctx.moveTo(s.pts[0].x, s.pts[0].y);
      for(let i=1;i<s.pts.length;i++) ctx.lineTo(s.pts[i].x, s.pts[i].y);
      ctx.stroke();
    }
    ctx.restore();
  }
  function repaint(){
    ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    cv._strokes.forEach(paintOne);
    ctx.restore();
  }
  function recalcInk(){
    let n=0;
    for(const s of cv._strokes){
      if(s.tool!=='pen') continue;
      for(let i=1;i<s.pts.length;i++) n += Math.hypot(s.pts[i].x-s.pts[i-1].x, s.pts[i].y-s.pts[i-1].y);
    }
    cv._ink = n;
  }

  // ponytail: 一次只跟踪首个触点；若真机手掌先落下挡住笔，再升级为笔优先。
  let cur=null, activePointer=null;
  cv.onpointerdown = e=>{
    if(cur) return;
    e.preventDefault();
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    activePointer=e.pointerId;
    const p = pos(e);
    cur = { tool: cv._tool, pts:[p] };
    cv._strokes.push(cur);
    paintOne(cur);
  };
  cv.onpointermove = e=>{
    if(!cur||e.pointerId!==activePointer) return;
    e.preventDefault();
    const p = pos(e);
    const last = cur.pts[cur.pts.length-1];
    const d = Math.hypot(p.x-last.x, p.y-last.y);
    if(d < 1.2) return;
    cur.pts.push(p);
    if(cur.tool==='pen') cv._ink += d;
    ctx.save(); applyTool(cur);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    ctx.restore();
  };
  const stop = e=>{ if(e.pointerId===activePointer){ cur=null; activePointer=null; } };
  cv.onpointerup = stop; cv.onpointercancel = stop; cv.onlostpointercapture = stop;

  cv._repaint = repaint;
  cv._undo = ()=>{ if(!cv._strokes.length) return false; cv._strokes.pop(); recalcInk(); repaint(); return true; };
  cv._clear = ()=>{ cv._strokes=[]; cv._ink=0; repaint(); };
  cv._inkNeeded = (letters)=> Math.max(90, (letters||4) * 16);   // 至少要画出这么多，才算"写了"
  return cv;
}

/* ---------- 结算 ---------- */
function finishLevel(){
  const total = Run.qs.length, right = Run.right;
  const stars = right===total?3 : right/total>=0.8?2 : right/total>=0.5?1 : 0;
  S.done[Run.id] = stars;
  // 记录战绩
  const d = today();
  const rec = Store.stats[d] || {stars:0,right:0,total:0,levels:0};
  rec.stars += Run.stars; rec.right += right; rec.total += total; rec.levels += 1;
  Store.stats[d] = rec; save(K.stats, Store.stats);
  save(KS.run, null);                 // 这一关做完了，不再需要断点
  saveSession();
  beep('done'); fxStars(stars>=2?6:3);
  go('result');
}

const REVIEW_GAPS=[1,3,7,14]; // 试用排程，不是固定的“遗忘曲线”参数
const Review={sessions:(()=>{
  const v=load(REVIEW_KEY,{sessions:[]});
  return v&&Array.isArray(v.sessions)?v.sessions:[];
})()};
function reviewDayAdd(day,n){
  const p=String(day).split('-').map(Number);
  const d=new Date(p[0],p[1]-1,p[2]+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function reviewKey(x){ return JSON.stringify([x.materialId||x.source||'teacher',x.unit,x.kind,norm(x.en)]); }
function reviewProgress(){
  const items=Object.create(null);
  for(const session of Review.sessions){
    const day=String(session.day||'');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(day)||!Array.isArray(session.entries)) continue;
    for(const x of session.entries){
      if(!x||!x.unit||!x.en||typeof x.ok!=='boolean') continue;
      const key=reviewKey(x), old=items[key];
      let level=old?old.level:0, due=old?old.due:reviewDayAdd(day,1);
      const passed=x.ok===true&&!x.expired&&!x.skipped;
      if(!passed){ level=0; due=reviewDayAdd(day,1); }
      else if(!old){ level=1; due=reviewDayAdd(day,1); }
      else if(old.lastDay!==day && old.due<=day){
        level=Math.min(old.level+1,REVIEW_GAPS.length);
        due=reviewDayAdd(day,REVIEW_GAPS[level-1]);
      }
      items[key]={unit:x.unit,kind:x.kind,en:x.en,zh:x.zh||'',source:x.source||'teacher',materialId:x.materialId||'',level,due,
        lastDay:day,lastOk:passed,attempts:(old?.attempts||0)+1,
        wrongCount:(old?.wrongCount||0)+(x.ok===false&&!x.expired&&!x.skipped?1:0),
        timeoutCount:(old?.timeoutCount||0)+(x.expired?1:0),
        skipCount:(old?.skipCount||0)+(x.skipped?1:0)};
    }
  }
  return Object.values(items);
}
function reviewDueAll(){
  const day=today();
  return reviewProgress().filter(x=>x.due<=day).sort((a,b)=>
    Number(a.lastOk)-Number(b.lastOk)||a.due.localeCompare(b.due)||b.wrongCount-a.wrongCount);
}
function reviewDoneToday(){
  const keys=new Set();
  for(const s of Review.sessions) if(s.day===today()&&s.source==='due')
    for(const x of s.entries||[]) keys.add(reviewKey(x));
  return keys.size;
}

async function importLearningArchive(file){
  try{
    if(file.size>5*1024*1024) throw Error('档案太大，请先检查文件');
    const data=JSON.parse(await file.text());
    if(data.schemaVersion!==2||!Array.isArray(data.materials)||!Array.isArray(data.dictationSessions)
      ||data.materials.length>200||data.dictationSessions.length>1000)
      throw Error('不是有效的学习档案');
    if(data.profileId&&data.profileId!==Profile) throw Error('这份档案属于另一位孩子');
    if(materialList().length||Review.sessions.length||Store.wrong.length)
      throw Error('当前档案已有记录，请先导出备份，再决定如何合并');
    showModal('确认归属','将 <b>'+esc(file.name)+'</b> 恢复到 <b>'+PROFILE_NAMES[Profile]+'</b> 的独立档案？',[
      {t:'取消'},
      {t:'确认恢复',primary:true,fn:async()=>{
        const values=[[KS.materials,data.materials],[REVIEW_KEY,{sessions:data.dictationSessions}],
          [KS.session,data.activeLesson||null],[K.wrong,Array.isArray(data.previousWrongBook)?data.previousWrongBook:[]],
          [K.stats,data.previousStats&&typeof data.previousStats==='object'?data.previousStats:{}],
          [K.grade,Number(data.grade)||Store.grade],
          [SETTINGS_KEY,{...SETTINGS_DEFAULT,...(data.settings||{})}]];
        const old=values.map(([key])=>[key,localStorage.getItem(key)]);
        try{
          for(const [key,value] of values){
            if(value===null) localStorage.removeItem(key);
            else localStorage.setItem(key,JSON.stringify(value));
          }
        }catch(e){
          for(const [key,value] of old){
            if(value===null) localStorage.removeItem(key);
            else localStorage.setItem(key,value);
          }
          toast('空间不足，旧档案未恢复');return;
        }
        if(Cloud.paired){Cloud.pending=true;await cloudSync();}
        location.reload();
      }}
    ],true);
  }catch(e){toast(e.message||'无法读取学习档案');}
}

let dictAudio=null, dictAudioDone=null, dictVoiceSeq=0;
function dictStop(){
  if(Dict.tick){ clearInterval(Dict.tick); Dict.tick=null; }
  Dict.ends=0;
  dictVoiceSeq++;
  if(dictAudio){ dictAudio.pause(); dictAudio.src=''; dictAudio=null; }
  if(dictAudioDone){ dictAudioDone(false); dictAudioDone=null; }
  stopSpeak();
}
async function dictSpeakChinese(text){
  const seq=++dictVoiceSeq;
  const localPreview=location.port==='8101';
  // ponytail: 8101 试用服务直接用已配置的 Vivi；断网时才退回设备语音。
  if(!navigator.onLine||(!Cloud.paired&&!localPreview)){ await speakWait(text,1,'zh-CN',true); return seq===dictVoiceSeq; }
  try{
    const result=localPreview
      ? await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})}).then(async r=>{if(!r.ok) throw Error('语音服务暂不可用');return r.json();})
      : await cloudCall('speech',{profileId:Profile,text});
    if(seq!==dictVoiceSeq) return false;
    const audio=new Audio('data:audio/mpeg;base64,'+result.audio);
    dictAudio=audio;
    const played=await new Promise(resolve=>{
      dictAudioDone=resolve;
      audio.onended=()=>resolve(true);
      audio.onerror=()=>resolve(false);
      audio.play().catch(()=>resolve(false));
    });
    if(dictAudio===audio){dictAudio=null;dictAudioDone=null;}
    return played&&seq===dictVoiceSeq;
  }catch{return false;}
}
function dictExact(a,b){
  const tidy = s=>fixEnglishApostrophes(s).trim().replace(/\s+/g,' ');
  return tidy(a)===tidy(b);
}
// ponytail: 元音组估算音节；少数不规则词需要词典音标或教师校准时再升级。
function dictSyllables(text){
  return (String(text).toLowerCase().match(/[a-z]+/g)||[]).reduce((total,part)=>{
    const groups=(part.match(/[aeiouy]+/g)||[]).length;
    const silentE=part.length>3&&/[^aeiouy]e$/.test(part)&&!/le$/.test(part)?1:0;
    return total+Math.max(1,groups-silentE);
  },0);
}
function dictSeconds(x){ return x.kind==='sent'?Settings.sentenceSeconds:dictSyllables(x.en)>3?Settings.longWordSeconds:Settings.wordSeconds; }
function dictNear(a,b){ return norm(a)===norm(b); }
// 复用原第六关的画布；把透明笔迹铺在白底上交给识别服务。
function dictInkImage(cv){
  const out=document.createElement('canvas');
  out.width=cv.width; out.height=cv.height;
  const ctx=out.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,out.width,out.height);
  ctx.drawImage(cv,0,0);
  return out.toDataURL('image/jpeg',.88);
}
const DICT_HAND_PROMPT = '只转写图片中学生手写的英文，不要根据题意猜测、补全或纠正拼写。看不清就返回空字符串。只输出 JSON：{"text":"看到的英文原文"}。';
async function dictGradeHand(i){
  const r=Dict.records[i], expected=Dict.items[i].en, cfg=getApiCfg();
  if(!r.ink){ r.ok=false; return; }
  try{
    const blob=await (await fetch(r.ink)).blob();
    let data;
    if(!cfg&&(AI_STATE==='cloud'||Cloud.paired))
      data=await cloudCall('handwrite',{profileId:Profile,mime:'image/jpeg',image:await imageBase64(blob)});
    else if(cfg) data=await vlmDirect(cfg,blob,DICT_HAND_PROMPT);
    else{
      if(AI_STATE!=='ready' && await checkAi()!=='ready') throw new Error('识别服务未连接');
      const response=await fetch('api/handwrite',{method:'POST',headers:{'Content-Type':'image/jpeg'},body:blob});
      data=await response.json();
      if(!response.ok||!data.ok) throw new Error(data.message||'识别服务暂不可用');
    }
    r.answer=String(data.text||'').trim();
    r.ok=r.answer ? dictExact(r.answer,expected) : null;
    r.error=r.ok===null?'笔迹没认清，请重试或重写':'';
  }catch(e){ r.ok=null; r.error='识别暂不可用，请重试'; }
}
async function dictGradeAll(){
  if(Dict.grading) return;
  Dict.grading=true;
  const round=Dict.round;
  // 连测已在题间静默识别；这里等待进行中的请求，避免末尾逐题重发。
  for(let i=0;i<Dict.records.length;i++){
    if(round!==Dict.round){
      Dict.grading=false;
      if(route==='dictResult') renderDictationResult();
      return;
    }
    if(Dict.records[i].ok!==undefined) continue;
    const status=$('#dictGradeStatus');
    if(status) status.textContent='正在识别 '+(i+1)+'/'+Dict.records.length;
    await (Dict.gradeTasks.get(i)||dictGradeHand(i));
  }
  Dict.grading=false;
  if(route==='dictResult'&&round===Dict.round) renderDictationResult();
}
async function dictRetryUnclear(indices){
  if(Dict.grading) return;
  Dict.grading=true;
  const round=Dict.round;
  for(const i of indices){
    if(round!==Dict.round) break;
    await dictGradeHand(i);
  }
  Dict.grading=false;
  if(route==='dictResult'&&round===Dict.round) renderDictationResult();
}

async function dictStart(phase, useExisting=false){
  if(!useExisting){
    if(Dict.mode==='hand'&&!getApiCfg()&&!['ready','cloud'].includes(AI_STATE)&&!['ready','cloud'].includes(await checkAi())){
      toast('手写识别未连接，请先连接家长账号或改用打字'); return;
    }
    if(Dict.source==='current'&&!S.unit.trim()){ toast('先填本课 Unit，错题才能归类'); return; }
    Dict.fullItems=dictSourceItems();
    if(!Dict.fullItems.length){ toast('先拍照或粘贴一批内容，再到核对页勾选'); return; }
    if(Dict.fullItems.some(x=>!x.zh.trim())){ toast('有内容没填中文，请先到核对页补齐'); return; }
    Dict.items=Dict.fullItems.slice();
    Dict.retryOf='';
  }
  Dict.phase=phase; Dict.records=[]; Dict.i=0; Dict.feedback=false; Dict.saving=false; Dict.gradeTasks=new Map(); Dict.gradeTail=null; Dict.round++;
  Dict.startedAt=Date.now(); Dict.day=today(); Dict.id=String(Dict.startedAt)+'-'+Math.random().toString(36).slice(2);
  go('dictPlay');
}

  const x=Dict.items[Dict.i], warm=Dict.phase==='warm', seconds=dictSeconds(x);
  if(!Dict.feedback) dictStop();
  const record=Dict.records[Dict.i];
  const unclear=Dict.feedback&&Dict.mode==='hand'&&record?.ok===null;

    (record?.ink?'<img class="dict-ink" src="'+record.ink+'" alt="本题手写笔迹">':'')+
    '<p class="sub">'+esc(record.error||'系统没认清笔迹')+'</p></div>' : Dict.feedback ? '<div class="dict-answer '+(record?.ok===false?'bad':'')+'">'+
    (record?.ink?'<img class="dict-ink" src="'+record.ink+'" alt="本题手写笔迹">':'')+
    '<p class="sub">'+(Dict.mode==='hand'?'识别结果：':'你写的：')+esc(record?.answer||record?.error||'（未写）')+'</p>'+
    '<p class="sub">老师清单的英文</p><b>'+esc(x.en)+'</b>'+
    (record?.answer&&!record.ok&&dictNear(record.answer,x.en)?'<p class="sub">很接近，请核对大小写、标点、空格和连字符。</p>':'')+
    '</div>' : '';
  $('#wrap').innerHTML = '<div class="screen"><div class="card">'+
    '<div class="pbar"><button class="bar-btn" id="dictBack">←</button>'+
    '<div class="progress"><i style="width:'+(Dict.i/Dict.items.length*100).toFixed(1)+'%"></i></div>'+
    '<div class="cnt">'+(Dict.i+1)+'/'+Dict.items.length+'</div></div>'+
    '<p class="sub center">'+(warm?'摸底':'连测中')+'</p>'+
    (!Dict.feedback?'<div class="dict-time-row"><div class="dict-countdown" id="dictCount">'+seconds+'<small>秒</small></div></div><div class="dict-timer" id="dictTimer"><i id="dictFill"></i></div>':'')+
    '<div class="qcard"><div class="dict-prompt">'+esc(x.zh)+'</div></div>'+
    (!Dict.feedback?'<button class="btn sm ghost hide" id="dictVoiceRetry" type="button">中文播报失败，点此重试</button>':'')+
    (Dict.feedback ? answerBox+
      (unclear?'<div class="row"><button class="btn primary" id="dictRetry">重新识别</button><button class="btn ghost" id="dictRewrite">重写这题</button></div>':
      '<button class="btn primary" id="dictNext" style="margin-top:12px">下一题</button>') :
      (Dict.mode==='type'?'<input class="dict-input" id="dictInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="在这里写英文">':
        '<div class="handwrap dict-hand '+(x.kind==='sent'?'tall':'')+'">'+handGuidesHTML(x.kind==='sent')+'<canvas class="hand" id="dictCanvas" aria-label="在这里手写英文"></canvas></div>'+
        '<div class="row" style="margin-top:8px"><button class="btn sm ghost" id="dictUndo">↩️ 撤销</button><button class="btn sm ghost" id="dictClear">🧹 清空</button></div>')+
      '<div class="row" style="margin-top:12px"><button class="btn primary" id="dictSubmit">'+(warm?'写好了，系统核对':'写好了，下一题')+'</button><button class="btn ghost" id="dictSkip" type="button" disabled>跳过，下一题</button></div>')+
    '</div></div>';
  $('#dictBack').onclick=exitDictation;
  if(Dict.feedback){
    if(unclear){
      $('#dictRetry').onclick=async()=>{
        if(Dict.saving) return;
        Dict.saving=true; $('#dictRetry').disabled=true; $('#dictRetry').textContent='识别中…';
        const at=Dict.i;
        await dictGradeHand(at);
        Dict.saving=false;
        if(route==='dictPlay'&&Dict.i===at) renderDictationQuestion();
      };
      $('#dictRewrite').onclick=()=>{ Dict.records.splice(Dict.i,1); Dict.feedback=false; renderDictationQuestion(); };

      Dict.i++; Dict.feedback=false; renderDictationQuestion();
    };
    return;

  $('#dictSubmit').onclick=()=>dictSave(false);
  $('#dictSkip').onclick=()=>dictSave(false,true);

    $('#dictInput').focus();

  const round=Dict.round, index=Dict.i;
  const playPrompt=()=>{
    $('#dictVoiceRetry')?.classList.add('hide');
    void dictSpeakChinese(x.zh).then(played=>{
      if(route!=='dictPlay'||Dict.feedback||Dict.round!==round||Dict.i!==index) return;
      if(played){Dict.voiceReady=true;$('#dictSkip').disabled=false;dictStartTimer(seconds);}
      else $('#dictVoiceRetry')?.classList.remove('hide');
    });
  };
  Dict.voiceReady=false;
  $('#dictVoiceRetry').onclick=playPrompt;
  playPrompt();
}
function dictStartTimer(seconds){
  if(Dict.tick) clearInterval(Dict.tick);
  Dict.ends=Date.now()+seconds*1000;
  Dict.tick=setInterval(()=>{
    if(route!=='dictPlay'||Dict.feedback){ dictStop(); return; }
    const left=Math.max(0,Dict.ends-Date.now());
    $('#dictCount').innerHTML=String(Math.ceil(left/1000))+'<small>秒</small>';
    $('#dictCount').classList.toggle('low',left<4000);
    $('#dictTimer').classList.toggle('low',left<4000);
    $('#dictFill').style.width=(left/(seconds*1000)*100)+'%';
    if(left<=0) dictSave(true);
  },100);
}
async function dictSave(expired,skipped=false){
  if(route!=='dictPlay'||Dict.feedback||Dict.saving||Dict.records.length!==Dict.i) return;
  if(!Dict.voiceReady){ toast('等中文播报完成'); return; }
  expired=expired||!!(Dict.ends&&Date.now()>=Dict.ends);
  if(expired) skipped=false;
  const x=Dict.items[Dict.i], answer=Dict.mode==='type'?($('#dictInput')?.value||''):'';
  const cv=Dict.mode==='hand'?$('#dictCanvas'):null;
  if(cv && !expired && !skipped && cv._ink<20){ toast('先在格子里写英文'); return; }
  Dict.saving=true;
  const at=Dict.i;
  Dict.records.push({answer, ok:expired||skipped?false:Dict.mode==='type'?dictExact(answer,x.en):cv?undefined:false,
    ink:cv&&cv._ink>=20?dictInkImage(cv):'', expired, skipped});
  dictStop();
  if(Dict.phase==='warm'&&!expired&&!skipped){
    if(Dict.mode==='hand'){
      $('#dictSubmit').disabled=true;
      $('#dictSubmit').textContent='正在识别笔迹…';
      await dictGradeHand(at);
    }
    Dict.saving=false;
    if(route==='dictPlay'&&Dict.i===at){ Dict.feedback=true; renderDictationQuestion(); }
    return;
  }
  // ponytail: 单队列在写下一题时静默识别，避免快速交卷打满模型接口；积压时结果页仍需等待。
  if(Dict.phase==='mock'&&!expired&&!skipped&&Dict.mode==='hand'){
    const round=Dict.round;
    Dict.gradeTail=(Dict.gradeTail||Promise.resolve()).catch(()=>{}).then(()=>round===Dict.round?dictGradeHand(at):undefined);
    Dict.gradeTasks.set(at,Dict.gradeTail);
  }
  Dict.saving=false;
  Dict.i++; renderDictationQuestion();
}
function renderDictationResult(){
  dictStop();
  if(Dict.mode==='hand'&&Dict.records.some(r=>r.ok===undefined)){
    $('#wrap').innerHTML='<div class="screen"><div class="card center"><h2 id="dictGradeStatus">正在识别笔迹…</h2></div></div>';
    dictGradeAll();
    return;
  }
  const saved=reviewSyncSession();
  const total=Dict.items.length;
  const checked=Dict.records.filter(r=>!r.expired&&!r.skipped&&r.ok!==null&&r.ok!==undefined).length;
  const unclear=Dict.records.map((r,i)=>r.ok===null?i:-1).filter(i=>i>=0);
  const right=Dict.records.filter(r=>r.ok===true&&!r.expired&&!r.skipped).length;
  const late=Dict.records.map((r,i)=>r.expired?i:-1).filter(i=>i>=0);
  const skipped=Dict.records.map((r,i)=>r.skipped?i:-1).filter(i=>i>=0);
  const pending=[...late,...skipped];
  const wrong=Dict.items.filter((x,i)=>!Dict.records[i].expired&&!Dict.records[i].skipped&&Dict.records[i].ok===false);
  const rows=Dict.items.map((x,i)=>{
    const r=Dict.records[i];
    const status=r.expired?'来不及':r.skipped?'主动跳过':r.ok===null?'系统未识别':r.ok?'写对':'还需练习';
    return '<div class="dict-result-row"><div class="zh">'+esc(x.zh)+'　<span class="sub">'+status+'</span></div>'+
      '<div class="en">'+esc(x.en)+'</div>'+
      (Dict.mode==='type'?'<p class="sub">你的答案：'+esc(r.answer||'（未写）')+'</p>':
        (r.ink?'<img class="dict-ink" src="'+r.ink+'" alt="本题手写笔迹">':'')+
        '<p class="sub">'+(r.expired?'计时结束，未按时交卷':r.skipped?'本题主动跳过':'系统识别：'+esc(r.answer||r.error||'（未写）'))+'</p>'+
        (r.ok===null?'<button class="btn sm ghost" data-dict-retry="'+i+'">重新识别</button>':''))+
      '</div>';
  }).join('');
  $('#wrap').innerHTML='<div class="screen"><div class="card">'+
    '<h1>'+(Dict.phase==='warm'?'摸底结果':'课堂连测结果')+'</h1>'+
    '<p class="sub">'+(Dict.mode==='hand'
      ?(total-pending.length?'系统核对 '+checked+'/'+(total-pending.length)+' 题'+(unclear.length?'，未识别 '+unclear.length+' 题可重试。':'。'):'这轮都未完成，先补写。')
      :'本轮第一次独立写对的题数。')+'</p>'+
    '<div class="dict-meta"><span>按时写对 '+right+'/'+total+'</span><span>来不及 '+late.length+' 题</span><span>主动跳过 '+skipped.length+' 题</span></div>'+
    '<p class="sub">'+(Dict.source==='sample'?'示例结果不保存。':saved?'结果已存在这台设备，按 Unit 安排下次复习。':'本机记录未保存，请立即导出档案。')+'</p>'+
    rows+
    (!saved?'<button class="btn primary" id="dictExportNow">导出学习档案</button>':'')+
    (unclear.length?'<button class="btn sm ghost" id="dictRetryAll" style="margin-top:12px">重新识别未判的 '+unclear.length+' 题</button>':'')+
    (pending.length?'<button class="btn primary" id="dictMakeUp" style="margin-top:12px">补写未完成的 '+pending.length+' 题</button>':'')+
    '<div class="row" style="margin-top:16px"><button class="btn primary" id="dictAgain">'+(Dict.source==='due'?'返回复习计划':Dict.phase==='warm'?'按课堂节奏连测':'完整再测一轮')+'</button>'+
    (wrong.length?'<button class="btn ghost" id="dictWrong">只练写错的题</button>':'')+'</div>'+
    '<button class="btn sm ghost" id="dictSetup" style="margin-top:12px">返回设置</button>'+
    (Dict.source==='sample'?'':'<button class="btn sm ghost" id="dictPlan" style="margin-top:12px">查看复习计划</button>')+
    '</div></div>';
  $('#dictAgain').onclick=()=>{
    if(Dict.source==='due'){ go('plan'); return; }
    Dict.items=Dict.fullItems.slice(); dictStart('mock',true);
  };
  if($('#dictWrong')) $('#dictWrong').onclick=()=>{
    Dict.items=wrong.slice(0,10); dictStart('warm',true);
  };
  $('#dictSetup').onclick=()=>go('dictation');
  if($('#dictPlan')) $('#dictPlan').onclick=()=>go('plan');
  if($('#dictRetryAll')) $('#dictRetryAll').onclick=()=>dictRetryUnclear(unclear);
  if($('#dictExportNow')) $('#dictExportNow').onclick=exportLearningArchive;
  if($('#dictMakeUp')) $('#dictMakeUp').onclick=()=>{
    const original=Dict.retryOf||Dict.id;
    Dict.items=pending.map(i=>Dict.items[i]);
    Dict.retryOf=original;
    dictStart('warm',true);
  };
  $$('[data-dict-retry]').forEach(b=>b.onclick=()=>dictRetryUnclear([+b.dataset.dictRetry]));
}

    {t:'继续本轮',primary:true},
    {t:'退出到设置',danger:true,fn:()=>{ dictStop(); go('dictation'); }}
  ]);
}

/* 首次触摸激活音频上下文 + 解锁 iOS 的语音（iOS 要求语音必须由用户手势"开封"过，
   否则后面自动播放会被静默丢弃或排队错乱） */
window.addEventListener('pointerdown', function once(){
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){}
  try{
    if(!window.__ttsUnlocked && 'speechSynthesis' in window){
      window.__ttsUnlocked = true;
      const u = new SpeechSynthesisUtterance(' ');
      u.lang = 'en-US'; u.volume = 0;
      speechSynthesis.speak(u);
    }
  }catch(e){}
  window.removeEventListener('pointerdown', once);
});

/* 启动：先恢复上次的内容和没做完的那一关 */
applyHashConfig();                    // 支持一次性配置链接 …/#k=你的key
// 页面已经开着时再点这种链接，只会改 hash 不刷新 —— 所以也要监听 hash 变化
window.addEventListener('hashchange', ()=>{
  if(applyHashConfig()){ refreshAiBadge(); toast('AI 识别已配置 ✅', 1600); }
});
if(Profile){
  restoreSession();
  if(Cloud.paired) queueCloudSync();
  if(restoreRun()){ go('levels'); } else { go('home'); }
}else go('profile');
